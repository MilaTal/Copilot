# База знаний для советов Senior Pilot. Поле source показывается у совета: Senior Pilot ставит его в скобках, когда опирается на такой совет.
# Поля: id, step (1..6 — шаг Ш1–Ш6), when — когда давать совет, advice — сам совет,
# question — вопрос, которым Senior Pilot его открывает, basis — основа (agent-practice | triz | both),
# source — показываемый источник: «ТРИЗ», «теория управления проектами», «AI-native playbook» (только для них).
advice:
- id: SP1-01
  step: 1
  when: идея описана через инструмент («хочу агента», «внедрить нейросеть»), без входа и выхода
  advice: Идея, названная через инструмент, не говорит, что изменится у людей. Опишите, что приходит на вход, что получается на выходе и кто перестанет делать это руками. Инструмент выберем на следующем
    шаге.
  question: Что приходит на вход и что должно получиться на выходе — если не упоминать модель?
  basis: both
  source: ТРИЗ
- id: SP1-02
  step: 1
  when: в боли назван симптом («долго», «неудобно») без причины
  advice: Автоматизация симптома переносит очередь на соседний участок, и жалобы остаются. Спросите «почему» ещё раз, пока не дойдёте до причины, на которую можно повлиять.
  question: А почему так получается?
  basis: both
  source: ТРИЗ
- id: SP1-03
  step: 1
  when: картина успеха описывает свойства будущей системы («будет чат-бот с кнопками»)
  advice: Опишите результат так, будто нужная функция выполняется, а новой системы нет вовсе. Такая картина показывает, какие шаги можно не автоматизировать, а убрать, — это самое дешёвое решение.
  question: Если бы задача решалась сама, что увидел бы пользователь утром?
  basis: triz
  source: ТРИЗ
- id: SP1-04
  step: 1
  when: в таблице As-Is записаны операции («секретарь печатает протокол»), а не их назначение
  advice: Записывайте, какую функцию шаг выполняет для следующего, а не только действие. Функцию «задача не теряется» можно выполнить разными способами, а операцию «напечатать протокол» — только одним.
  question: Что сломается у следующего шага, если этот исчезнет?
  basis: triz
  source: ТРИЗ
- id: SP1-05
  source: исследование рынка аналогичных проектов и практика
  step: 1
  when: в таблице только шаги, где работу делают, и ни одного, где она ждёт
  advice: Шаги, где работа лежит и ждёт, часто дают больший выигрыш, чем шаги, где её делают. Если документ неделю ждёт согласования, ускорение исполнителя срок не сдвинет.
  question: Где работа лежит и ждёт, а не делается?
  basis: agent-practice
- id: SP1-06
  step: 1
  when: названы пользователь и выигравший, но нет того, кому прибавится работы
  advice: Тот, кому после запуска прибавится работы, может тихо остановить пилот. Назовите его сейчас и подумайте, что он получит взамен. Боль редко исчезает — чаще переезжает к соседу.
  question: Кому после запуска станет неудобнее и куда переедет часть работы?
  basis: both
  source: ТРИЗ
- id: SP1-07
  source: исследование рынка аналогичных проектов и практика
  step: 1
  when: решение системы касается людей вне команды — исполнителей, контрагентов, клиентов
  advice: Человек, которого касается решение системы, должен понимать, что его подготовила машина, и иметь способ его оспорить. Иначе первая ошибка превратится в жалобу на компанию, а не в правку.
  question: Кого затронет решение системы и где он узнает, как его оспорить?
  basis: agent-practice
- id: SP1-08
  source: исследование рынка аналогичных проектов и практика
  step: 1
  when: «данные в головах», следов работы нет
  advice: Без следов работы эффект нечем померить, а проверочные случаи неоткуда взять. Начните вести простой журнал до пилота — даже короткая история даст значение «до».
  question: Если бы пришлось восстановить, что было на прошлой неделе, — где бы вы искали?
  basis: agent-practice
- id: SP1-09
  step: 1
  when: для решения перечислены только системы, которые надо построить или купить
  advice: 'Прежде чем строить новое, посмотрите, что уже есть: журналы, справочники, проверки, которые люди и так делают. Готовый ресурс часто закрывает половину задачи и не требует нового бюджета.'
  question: Какие данные или проверки уже существуют и сейчас не используются?
  basis: triz
  source: ТРИЗ
- id: SP1-10
  source: исследование рынка аналогичных проектов и практика
  step: 1
  when: не упомянуты прошлые случаи с известным правильным результатом
  advice: 'Прошлые случаи, где известно, как было правильно, — самый ценный актив проекта: на них проверяют качество до запуска. Отберите их сейчас, пока люди помнят, чем всё кончилось.'
  question: Есть ли прошлые случаи, где известен правильный результат, и кто его подтвердит?
  basis: agent-practice
- id: SP1-11
  step: 1
  when: нет роли, которой важен результат, или назван «отдел в целом»
  advice: "Проект без человека, которому важен результат, заканчивается на демонстрации. Найдите, кому эта боль стоит денег или нервов, до того как писать код, и отдельно — у кого бюджет, а кто влияет на решение: часто это разные люди, и защита нужна обоим."
  question: Кому эта боль стоит денег?
  basis: agent-practice
  source: "AI-native playbook"
- id: SP1-12
  step: 1
  when: "в подтверждение боли собраны только доводы «за», противоречащие факты не искали"
  advice: "Доводы «за» найдутся всегда, особенно если искать их с помощью модели — она находит то, о чём спросили. Отдельно соберите факты против идеи — случаи, где боли нет, и причины, по которым прежние попытки не взлетели. Если список «за» намного длиннее списка «против», проверьте, не искали ли вы только подтверждение."
  question: "Что говорит против этой идеи и кто из пользователей с ней не согласится?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP1-13
  step: 1
  when: "боль подтверждена ответами вида «было бы удобно», «я бы пользовался»"
  advice: "Ответ о будущем — вежливость, а не факт: с идеей, за которую ничем не платят, соглашаются легко. Спрашивайте о прошлом — когда это случилось последний раз, что сделали и чем кончилось. Такой случай потом станет строкой таблицы отказов и проверочным случаем."
  question: "Расскажите о последнем разе, когда это случилось, — что произошло и что вы сделали?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP1-14
  step: 1
  when: "таблица As-Is переписана из регламента, шагов «по памяти» в ней нет"
  advice: "Часть работы идёт только потому, что конкретный человек о ней помнит, — напоминание, сверка, ежемесячная выгрузка. В регламенте таких шагов нет, и они первыми ломаются, когда человек в отпуске. Спросите, что встанет, если исполнитель неделю отсутствует, — так находятся скрытые шаги процесса."
  question: "Что перестанет происходить, если этот человек неделю будет недоступен?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP2-01
  step: 2
  when: в ядро предложены несколько шагов или «весь процесс»
  advice: Ядро — одна задача. Возьмите самый частый шаг, где нужно суждение и есть запись во внешнюю систему; остальные шаги разложатся вокруг него. Проекты, которые берут всё сразу, редко доходят до пилота.
  question: Если сделать только этот шаг, пользователь заметит разницу?
  basis: both
  source: ТРИЗ
- id: SP2-02
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: агент поставлен на шаг, который описывается условиями «если — то»
  advice: 'Если шаг рисуется блок-схемой, ставьте правило: оно дешевле, быстрее и одинаково отвечает каждый раз. Модель нужна там, где решение появляется по ходу работы.'
  question: Можно ли нарисовать этот шаг условиями «если — то»?
  basis: agent-practice
- id: SP2-03
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: выбран агент, а более простой вариант не рассматривался
  advice: 'Прежде чем выбирать агента, проверьте самое простое: правило, шаблон или один вызов модели с примерами. Если простое даёт почти то же, сложность не окупится в сопровождении.'
  question: Что даст один вызов модели без цикла и инструментов и чего в нём не хватит?
  basis: agent-practice
- id: SP2-04
  step: 2
  when: у всех шагов As-Is судьба «остаётся»
  advice: Самый дешёвый шаг — удалённый. Шаг, который существует ради отчётности или переносит данные из окна в окно, часто исчезает, если данные приходят сами. Агент на месте человека в старом процессе
    — старый процесс, только дороже.
  question: Какой шаг пропал бы, если бы данные приходили сами?
  basis: triz
  source: ТРИЗ
- id: SP2-05
  step: 2
  when: два требования тянут в разные стороны («полностью автоматически, но человек всё проверяет», «быстро и без ошибок»)
  advice: Не ищите середину между требованиями — разведите их. По условию — человек проверяет только необратимое и спорное. Во времени — сначала тень, потом самостоятельно. По частям — модель предлагает,
    код проверяет.
  question: В какой ситуации важнее первое требование, а в какой — второе?
  basis: triz
  source: ТРИЗ
- id: SP2-06
  step: 2
  when: на вопрос о размене ответ «ничего не ухудшится»
  advice: 'У каждого улучшения есть цена: время проверки, доверие, нагрузка на соседний участок. Назовите, что может ухудшиться, и сделайте это вторым показателем — он сторожит главный.'
  question: Какое число не должно упасть, пока растёт главное?
  basis: both
  source: ТРИЗ
- id: SP2-07
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: человек стоит «везде для надёжности» или «нигде»
  advice: 'Человек нужен там, где ошибку нельзя отменить или она тиражируется на следующие решения. Причина — свойство работы, а не «так надёжнее»: точка на каждом шаге съедает чужое время.'
  question: Какое решение вы не доверили бы даже аккуратному новичку и почему?
  basis: agent-practice
- id: SP2-08
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: действие агента — «готовит ответ», «формирует отчёт» без записи во внешнюю систему
  advice: Агент без записи во внешнюю систему — это чат, и заказчику нечего показать. Назовите глагол со следом и место, где изменение видно без журнала агента.
  question: Куда заглянет заказчик, чтобы убедиться, что действие было?
  basis: agent-practice
- id: SP2-09
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: доступа нет или «нужна заявка»
  advice: Проекты чаще встают на доступе, чем на модели. Подайте заявку сразу — она пойдёт параллельно с проектированием. На пилоте можно писать в промежуточную таблицу, которую видит владелец системы.
  question: Кто выдаёт доступ и сколько обычно идёт заявка?
  basis: agent-practice
- id: SP2-10
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: тип тайны «не знаю», а в данных есть ФИО, суммы или условия договоров
  advice: 'Где будет работать модель, решает тип тайны, и это меняет всю архитектуру. Спросите владельца данных до выбора модели: переделка после стоит дороже, чем вопрос сейчас.'
  question: Кто в компании владеет этими данными?
  basis: agent-practice
- id: SP2-11
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: KPI считает скорость модели, а не полное время работы
  advice: Считайте полное время вместе с проверкой человеком. Три минуты машины плюс полчаса проверки — не экономия получаса. Цель ставят после замера проверки на нескольких реальных случаях.
  question: Сколько займёт у человека проверка одного результата?
  basis: agent-practice
- id: SP2-12
  source: исследование рынка аналогичных проектов и практика
  step: 2
  when: потеря сейчас — «не знаю», и разговор встал
  advice: 'Оценка «примерно» лучше пустого места: из неё появится первая задача — замер. Возьмите минуты на одно действие и число повторов в неделю, а точнее посчитаем перед пилотом.'
  question: Сколько минут уходит на одно такое действие и сколько раз в неделю оно повторяется?
  basis: agent-practice
- id: SP2-13
  step: 2
  when: "гипотеза решения записана, но не названо, на чём она держится"
  advice: "Решение держится на нескольких допущениях — данные приходят вовремя, пользователь смотрит карточку, формат входа не меняется. Назовите три главных и что станет с проектом, если не выполнится одно из них. Допущение без проверки — строка реестра рисков, а не факт."
  question: "Какие три допущения должны быть верны, чтобы решение работало, и что будет, если одно из них неверно?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP2-14
  step: 2
  when: "ядро описано только через то, что оно делает, или функции добавляются «раз уж это быстро»"
  advice: "Когда функцию можно добавить за полдня, расползание объёма перестаёт ощущаться, а каждая добавка по отдельности выглядит оправданной. До сборки запишите, что ядро сознательно не делает и какое свидетельство от пользователей даст право это добавить. Тогда «а не сделать ли ещё» решается фактами, а не энтузиазмом."
  question: "Что ядро сознательно не делает и что должно случиться, чтобы это изменить?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP2-15
  step: 2
  when: "главное число выбрано, но не сказано, как выглядит ложный успех"
  advice: "Число может расти без пользы — протоколы создаются, но их не открывают; задачи закрываются, но потом их откатывают. До запуска запишите, какая картина будет ложным успехом для главного числа, и поставьте рядом показатель, который её разоблачит. Показатели, выбранные после запуска, обычно показывают то, что получилось, а не то, что сломалось."
  question: "При каком раскладе главное число вырастет, а пользы не будет?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP3-01
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: выбран сложный паттерн (несколько агентов, координатор) для последовательного процесса
  advice: Усложняйте устройство, только когда простое доказуемо не справляется. Несколько агентов — это больше вызовов, денег и мест для ошибки без добавленной работы.
  question: Какой самый простой из подходящих паттернов и что именно он не может?
  basis: agent-practice
- id: SP3-02
  step: 3
  when: правило со словом «всегда» или «никогда» записано только в промпте
  advice: 'Критичное правило выносится в код: модель забывает инструкции, а чужой текст их обходит. Проверка до записи во внешнюю систему стоит дёшево, а пропущенный запрет — дорого.'
  question: Что будет, если модель однажды забудет это правило?
  basis: both
  source: ТРИЗ
- id: SP3-03
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: инструменты описаны одним словом или похожи друг на друга
  advice: Модель выбирает инструмент по описанию, как новый сотрудник по инструкции. Два похожих инструмента с размытыми названиями — частая причина неверных действий; опишите, когда брать инструмент и
    когда нет.
  question: Поймёт ли новый сотрудник по описанию, когда брать этот инструмент, а когда соседний?
  basis: agent-practice
- id: SP3-04
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: ключ инструмента даёт доступ ко всей системе
  advice: Что умеет ключ, то умеет агент. Урезайте лишнюю функцию, лишнее право и лишнюю самостоятельность сейчас — это дешевле, чем потом находить их атакой.
  question: Что агент может сделать, хотя задаче это не нужно?
  basis: agent-practice
- id: SP3-05
  step: 3
  when: одна модель на все шаги «для простоты»
  advice: У разных шагов разная цена ошибки. Сильная модель — там, где нужно суждение, лёгкая — где работа идёт по правилу. Проверяющая модель другого семейства, иначе она повторит ошибку проверяемой.
  question: Этот шаг придумывает или выполняет по правилу — и сколько стоит ошибка на нём?
  basis: both
  source: ТРИЗ
- id: SP3-06
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: точки подтверждения стоят на каждом шаге
  advice: 'Если человек соглашается почти всегда, точка контроля превратилась в задержку и привычку нажимать не глядя. Мерьте долю правок: если она близка к нулю, точку переносят на выборочную проверку
    после факта.'
  question: Как вы узнаете, что подтверждают не глядя?
  basis: agent-practice
- id: SP3-07
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: на экране подтверждения описание действия, а не его параметры
  advice: Экран подтверждения и вызов должны брать значения из одного поля. Иначе человек подтверждает описание, а исполняется другое, и ответственность размывается.
  question: Текст на экране и параметры вызова берутся из одного места?
  basis: agent-practice
- id: SP3-08
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: эскалация «на команду», без срока или без исхода после срока
  advice: 'У спорного случая один адресат-роль, срок и исход после срока: безопасный вариант по умолчанию, подъём выше или видимая деградация. Исход выбирает бизнес, а не инженер.'
  question: Что делает система, если адресат не ответил к сроку?
  basis: agent-practice
- id: SP3-09
  step: 3
  when: плохой вход проверяется уже после вызова модели
  advice: Мусорный вход отсекайте до платного вызова — так экономятся деньги, и человек видит понятную причину отказа. Проверка заранее всегда дешевле исправления после.
  question: По какому признаку плохой вход ловится до модели?
  basis: both
  source: ТРИЗ
- id: SP3-10
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: повтор действия не продуман
  advice: Повтор без ключа превращает сбой сети в два письма подрядчику или две задачи в реестре. Ключ берут из бизнес-полей, которые не меняются при повторе, а не из времени запроса.
  question: По каким полям система поймёт, что это то же самое действие?
  basis: agent-practice
- id: SP3-11
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: защита от одновременных запусков — «кнопка неактивна, пока идёт обработка»
  advice: Замок на кнопке защищает только от одного окна. Два пользователя, две вкладки и повтор по сети его обходят — замок ставят на данные.
  question: Что будет, если двое одновременно изменят один и тот же объект?
  basis: agent-practice
- id: SP3-12
  step: 3
  when: действие пишет в несколько мест, а частичный отказ не описан
  advice: 'Половина сделанного часто хуже, чем ничего: данные расходятся между системами. Для таких действий заранее спроектируйте обратное действие или дозапись вручную.'
  question: Что хуже в вашем случае — половина сделана или ничего не сделано?
  basis: both
  source: ТРИЗ
- id: SP3-13
  source: исследование рынка аналогичных проектов и практика
  step: 3
  when: следующий шаг принимает результат предыдущего без проверки
  advice: Правдоподобная ошибка одного шага, принятая следующим как факт, размножается по всей цепочке. Ставьте проверку на стыках, а не только в конце.
  question: Что делает следующий шаг, если предыдущий вернул правдоподобную ошибку?
  basis: agent-practice
- id: SP3-14
  step: 3
  when: реальные случаи отказов из шага 1 не попали в таблицу отказов
  advice: Каждый реальный сбой — готовая строка таблицы отказов и готовый проверочный случай. Записанный сбой работает на проект дважды, а выдуманный — ни разу.
  question: Какой из прошлых случаев первым попадёт в таблицу отказов?
  basis: triz
  source: ТРИЗ
- id: SP4-01
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: собраны отдельные функции, но нет сквозного пути
  advice: 'Сначала сквозной путь на одном входе: триггер, вызов, запись во внешней системе. Набор функций без сквозного пути показывает текст, а не систему.'
  question: Какой самый короткий путь от события до записи можно прогнать сегодня?
  basis: agent-practice
- id: SP4-02
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: прототип запускается без записанных ожиданий
  advice: Ожидание, записанное после прогона, подгоняется под результат. Три входа — типовой, трудный и такой, где правильно отказать, — с ожиданием до первого запуска снимают спор «работает или нет».
  question: На каком входе правильный ответ — отказ?
  basis: agent-practice
- id: SP4-03
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: результат прототипа виден только в журнале агента
  advice: Пока изменение видно только в журнале агента, доказательства нет. Проверьте вторым окном — в той системе, куда шла запись.
  question: Что вы увидели в самой внешней системе?
  basis: agent-practice
- id: SP4-04
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: потолки «как стояли в платформе» или «чтобы хватило»
  advice: У агентного цикла нет естественного конца. Потолок — наблюдаемый максимум с запасом в полтора-два раза, а значение по умолчанию — не обоснование.
  question: Какой максимум вы видели на прогонах?
  basis: agent-practice
- id: SP4-05
  step: 4
  when: прототип гоняется на рабочей базе и рабочем ключе
  advice: 'Пробуйте на копии: отдельная база, отдельный ключ с низким лимитом. Копия снимает страх ошибки и делает пробы дешёвыми, а рабочие данные остаются целыми.'
  question: Чем стенд отделён от прода?
  basis: both
  source: ТРИЗ
- id: SP4-06
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: «своё железо — значит бесплатно и безопасно»
  advice: 'Своё железо не бесплатно: главный расход — инженер, который его держит. Где работать модели, решают по тайне, а цену сравнивают по полной сумме в месяц.'
  question: Сколько часов инженера в месяц уйдёт на свой сервер?
  basis: agent-practice
- id: SP4-07
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: условия провайдера подтверждены словами «они не обучаются»
  advice: 'Заявление провайдера проверяется договором: срок хранения запросов, обучение, отключение журналов. У подписки и у ключа условия часто разные.'
  question: Где в договоре написано про хранение и обучение для вашего типа доступа?
  basis: agent-practice
- id: SP4-08
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: в устройстве есть чужие коннекторы, плагины или серверы инструментов
  advice: Сторонний компонент получает права вашего агента. Закрепите его версию, выясните, кто его выпускает, и дайте ему отдельный минимальный ключ.
  question: Кто выпускает этот компонент и что будет, если он обновится без вас?
  basis: agent-practice
- id: SP4-09
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: в журнале не различаются действия агента и человека
  advice: В журнале аудита должно быть видно, кто сделал запись — агент или человек — и на каком основании. Без этого любое спорное действие спишут на агента.
  question: Если завтра спросят, кто изменил эту запись, — где посмотрите?
  basis: agent-practice
- id: SP4-10
  source: исследование рынка аналогичных проектов и практика
  step: 4
  when: модель на шагах меняют на более дешёвую «на глаз»
  advice: 'Проектируют на сильной модели, чтобы увидеть потолок качества. Потом пробуют лёгкую там, где шаг идёт по правилу, и сверяют на том же наборе: без набора замена модели — догадка.'
  question: На каком наборе вы сравните сильную и лёгкую модель?
  basis: agent-practice
- id: SP4-11
  step: 4
  when: "прототип показали заказчику, и то, что он работает, приняли за доказательство ценности"
  advice: "Работающий прототип доказывает, что код запускается, а не что боль снята. Дайте ядро пятерым людям из той роли, для которой оно делается, и смотрите, что они делают с результатом, а не что говорят. По этим пяти разговорам решают — строить дальше или вернуться к постановке."
  question: "Кто из будущих пользователей уже пробовал прототип и что он сделал с результатом?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP4-12
  step: 4
  when: "прототип собирается с помощью модели, решения об устройстве нигде не записаны"
  advice: "Если решения об устройстве не записаны там, где их читает каждая сессия сборки, модель выводит их заново, и код расходится сам с собой — это всплывает поздно и дорого. Ведите один файл контекста — принципы устройства, запрещённые зависимости, сознательные размены, — а в конце сессии дописывайте, что сделано и какие допущения добавлены. Пять минут записи дешевле переделки."
  question: "Где записаны решения об устройстве и читает ли их каждая сессия сборки?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP4-13
  step: 4
  when: "код написан моделью, а проверка безопасности — «модель сама проверила» или её нет"
  advice: "Модель пишет код, который работает, а не код, который безопасен, — уязвимость не видна, пока ею не воспользовались. До первого пользователя проверьте вход и сессии, что отдаёт API, проверку входных данных и зависимости с известными уязвимостями. Автоматический разбор — первый проход; всё, что касается входа, ключей и персональных данных, смотрит человек."
  question: "Кто, кроме модели, смотрел код, который работает с ключами и персональными данными?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP5-01
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: качество подтверждено словами «погоняли — работает»
  advice: Впечатление от нескольких прогонов — не проверка, а модель оценивает себя выше, чем есть. Нужен набор случаев с ожидаемым результатом, записанным до прогона.
  question: Откуда взялся ожидаемый результат и кто его решил?
  basis: agent-practice
- id: SP5-02
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: в наборе только случаи, где система должна что-то сделать
  advice: Набор проверяет и то, что система должна сделать, и то, чего делать не должна. Случаи, где правильный ответ — отказ, ловят выдуманные действия.
  question: Какие случаи в наборе должны закончиться отказом?
  basis: agent-practice
- id: SP5-03
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: судья — модель, сверки с человеком нет
  advice: 'Прибор врёт чаще продукта. До серии прогонов сверьте судью с разметкой человека и прочитайте несколько журналов целиком: часть «провалов» окажется ошибкой проверки.'
  question: В скольких случаях судья согласился с человеком?
  basis: agent-practice
- id: SP5-04
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: каждый вход прогнан один раз
  advice: 'Один удачный прогон ничего не говорит о надёжности. Прогоните тот же вход несколько раз: для системы, которая работает с людьми, важно, чтобы были успешны все повторы.'
  question: Что получится, если тот же вход прогнать несколько раз подряд?
  basis: agent-practice
- id: SP5-05
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: названа цена вызова, а не цена принятого результата
  advice: 'ЛПР интересует цена принятого результата. Неудачные прогоны входят в цену: сумма всех прогонов делится на число успешных.'
  question: Сколько стоил неудачный прогон по сравнению с удачным?
  basis: agent-practice
- id: SP5-06
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: проверка сверяет точный порядок шагов агента
  advice: Проверяйте, что получилось во внешней системе, а не точную последовательность действий. Жёсткая проверка пути наказывает верные решения, найденные другим путём.
  question: Что должно оказаться во внешней системе, чтобы случай считался пройденным?
  basis: agent-practice
- id: SP5-07
  step: 5
  when: в наборе всё проходит
  advice: Набор, где проходит всё, перестал учить. Переведите его в регрессию и добавьте трудные случаи из свежих отказов.
  question: Какой свежий отказ ещё не попал в набор?
  basis: both
  source: ТРИЗ
- id: SP5-08
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: результат оценивается одним средним процентом
  advice: Средняя точность скрывает дорогие промахи. Считайте отдельно по типам случаев и отдельно — пропуски самого дорогого.
  question: Какой тип ошибки стоит дороже остальных и как часто он случается?
  basis: agent-practice
- id: SP5-09
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: атаки ищут только через чат
  advice: 'Чаще всего агент атакуют через данные, которые он читает: инструкция внутри письма, договора или файла. Испытывать надо каждый вход, который пишет посторонний человек.'
  question: Может ли в документ попасть текст, которого не видно глазом?
  basis: agent-practice
- id: SP5-10
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: права проверены по интерфейсу («кнопки удаления нет»)
  advice: Проверяйте запрос, а не экран. Если кнопки нет, а прямой вызов проходит, права не урезаны.
  question: Что ответит система на прямой запрос действия, которого нет на экране?
  basis: agent-practice
- id: SP5-11
  source: исследование рынка аналогичных проектов и практика
  step: 5
  when: ответ модели передаётся дальше — в запрос к базе, письмо, страницу
  advice: Ответ модели — тоже чужой текст для следующей системы. Проверяйте и экранируйте его так же, как ввод пользователя.
  question: Что сделает следующая система, если в ответе окажется команда?
  basis: agent-practice
- id: SP6-01
  step: 6
  when: переход между стадиями — «когда привыкнут», «через месяц»
  advice: 'Автономию открывают стадиями: тень, человек в контуре, самостоятельно. Каждый переход — по числу на своих прогонах, а не по календарю или ощущению.'
  question: Какое число покажет, что можно переходить на следующую стадию?
  basis: both
  source: ТРИЗ
- id: SP6-02
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: «самостоятельно» понимается как «без человека»
  advice: «Самостоятельно» значит «под мониторингом», а не «без хозяина». За человеком остаются спорные случаи и решение об откате.
  question: Что остаётся за человеком на последней стадии?
  basis: agent-practice
- id: SP6-03
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: в реестре рисков общие фразы («модель может ошибиться»)
  advice: Строка реестра — «агент делает X, и если не проверено Y, будет Z», а у неё контроль и владелец-роль. «Система» и «все» владельцами не бывают.
  question: Какое действие агента дороже всего при ошибке и кто за него отвечает?
  basis: agent-practice
- id: SP6-04
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: откат описан словами, без порога и выключателя
  advice: Поздно нажатый рубильник — частая причина громких провалов автоматизации. Нужен выключатель, порог в числах и роль, которая его нажимает.
  question: Какое число включает откат и кто нажимает выключатель?
  basis: agent-practice
- id: SP6-05
  step: 6
  when: восстановление данных ни разу не проверяли
  advice: Откат, который ни разу не проверяли, откатом не считается. Тест или агент однажды попадут в рабочую базу — проверенная копия окупится в тот же день.
  question: Когда восстановление проверяли последний раз и сколько оно заняло?
  basis: both
  source: ТРИЗ
- id: SP6-06
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: правка промпта или смена модели без прогона набора
  advice: 'Правка промпта без прогона набора — та же смена модели вслепую. Провайдеры снимают модели с окном в несколько месяцев: прогон «до и после» должен быть процедурой с владельцем.'
  question: Кто прогоняет набор перед сменой модели или промпта?
  basis: agent-practice
- id: SP6-07
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: не отслеживается, что входные данные меняются
  advice: 'Набор проверок стареет вместе с входом: новый формат, новый поставщик, другой язык. Следите за долей отказов разбора и ростом ручной очереди — они первыми покажут дрейф.'
  question: Какое число первым покажет, что вход изменился?
  basis: agent-practice
- id: SP6-08
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: нет способа для пользователя сообщить об ошибке системы
  advice: Пользователь должен сообщать об ошибке в одно действие, а этот случай — попадать в набор проверок. Иначе ошибки обсуждают в коридоре, а система о них не знает.
  question: Как пользователь сообщит об ошибке и куда попадёт этот случай?
  basis: agent-practice
- id: SP6-09
  source: исследование рынка аналогичных проектов и практика
  step: 6
  when: просьба к ЛПР — «бюджет на ИИ» или «поддержать проект»
  advice: 'Защита заканчивается одной просьбой: разрешением на следующую стадию или частью уже выделенного бюджета. За просьбой стоит число, которое ЛПР получит.'
  question: Какое одно решение нужно сейчас и ради какого числа?
  basis: agent-practice
- id: SP6-10
  step: 6
  when: после запуска Junior Pilot предлагает добавить функции к ядру
  advice: 'Развивайте систему туда, где сейчас самое слабое звено: после ускорения одного шага узким местом становится соседний. Перед расширением снова найдите, где работа ждёт.'
  question: Где работа ждёт теперь, когда ядро работает?
  basis: triz
  source: ТРИЗ
- id: SP6-11
  step: 6
  when: ядро стабильно, следующей цели нет
  advice: "Когда ядро работает, ищите выигрыш рядом: тот же механизм часто подходит соседнему процессу с похожим входом. Переносите, когда главное число держится на первом процессе, и не за счёт его пользователей — вход с другими правилами смешает данные, и станет непонятно, что работает. Переносите вместе с набором проверок, а не только код."
  question: Какой соседний процесс получает похожий вход?
  basis: triz
  source: "ТРИЗ; AI-native playbook"
- id: SP6-12
  step: 6
  when: "решение о переходе стадии принимают по первым дням после запуска"
  advice: "Первые дни показывают интерес к новинке, а не привычку — пробуют все, остаются не все. Цели на седьмой и тридцатый день записывают до запуска, а о стадии решают, когда первая волна спала, — через шесть недель, а не через одну. Если систему велено использовать, смотрите не на число входов, а на долю результатов, принятых без переделки."
  question: "Каким будет главное число через шесть недель, когда интерес к новинке спадёт?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP6-13
  step: 6
  when: "пользу пилота подтверждают словами руководителя или числом входов"
  advice: "Спросите тех, кто работал в пилоте, как они отнесутся, если систему отключат. Если больше 40 % ответят «очень расстроюсь», польза реальна; если систему приходится всё время напоминать и уговаривать, её пока толкают, а не она тянет. Для обязательной системы вопрос задают анонимно, иначе ответ будет руководителю, а не про систему."
  question: "Что скажут пользователи пилота, если завтра систему выключить?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP6-14
  step: 6
  when: "несколько циклов улучшений прошли, а главное число не сдвинулось"
  advice: "Если три цикла улучшений подряд не сдвинули главное число, четвёртый такой же не поможет — нужна диагностика. Проверьте, нет ли группы пользователей с заметно другим результатом, в чём разрыв — в том, как систему подали, или в ней самой, и что должно быть правдой, чтобы она заработала. По ответам решают — поправить, сменить группу пилота или вернуться к постановке проблемы."
  question: "Есть ли в данных пилота группа, у которой результат заметно лучше остальных?"
  basis: agent-practice
  source: "AI-native playbook"
- id: SP6-15
  step: 6
  when: "эксплуатация держится на одном человеке"
  advice: "Мысленно уберите владельца системы на неделю и пройдите по всем потокам. Встанет всё, где нет критерия передачи, пути эскалации или правила для исключения, — это места, которые надо дописать до сдачи. Знание, которое живёт только в голове, записывают так, чтобы его проверил аудит и принял другой человек."
  question: "Что перестанет работать, если владелец системы неделю недоступен?"
  basis: agent-practice
  source: "AI-native playbook"
