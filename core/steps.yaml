# Ядро copilot: 6 шагов создания проекта ИИ-агентной системы (Ш1–Ш6).
# Единственный источник вопросов, подсказок, примеров и рисков — и для приложения, и для работы в чате.
# Правило строгости: документ шага собирается только когда у каждого обязательного вопроса есть ответ.
# «Не знаю» и «Сознательно опускаю сейчас» — допустимые ответы; каждый сразу становится риском с владельцем.
# Переход между шагами не блокируется никогда — открытое только подсвечивается.
#
# migration — переход с прежнего маршрута из 12 шагов (коды WP01–WP12) на 6 шагов, схема 3.
#   map: «старый шаг:id» → «новый шаг:id» для всех 77 прежних вопросов; слитые вопросы указывают на
#   поглощающий. merge_rules — как переносится слитый ответ (append_text — дописать текстом с пометкой
#   старого шага; first_row — первой строкой таблицы; rows_by_step — построчно по шагу As-Is; column —
#   в колонку таблицы; required_row — в обязательную строку; extra_text — в доп. строку вопроса).
#   step_map — пересчёт current_step и start_step. new_questions — вопросы, которых раньше не было.
#
# Поля шага: id, code (Ш1–Ш6), slug, title, goal, artifact, ready (критерии готовности), questions,
# level — ключ из levels: что ожидается от ответов на этом шаге.
# segments — два отрезка шага {title, questions: [id, …]}; на полётном плане не рисуются, видны внутри
#   шага разделителем с подзаголовком. Порядок questions шага = порядок отрезков.
# no_numbers_segment — номер отрезка (с 1), где правило уровня «без чисел» продолжает действовать,
#   хотя уровень шага уже project. Сейчас — только Ш2, отрезок «Граница». На Ш1 без чисел весь шаг (sketch).
# lead — ведущий вопрос шага: им Senior Pilot открывает шаг, на него отвечают все вопросы шага вместе.
# synthesis: {title, template} — вывод шага. После последнего вопроса Senior Pilot заполняет template
#   подтверждёнными формулировками ответов и просит подтвердить или поправить. Плейсхолдер [question_id] —
#   ответ на вопрос целиком, [question_id: пояснение] — нужная часть ответа. Чего Junior Pilot не говорил,
#   в вывод не добавляется — только отдельной строкой «предлагаю добавить» на подтверждение.
# gate: {n, title, checks, question} — мягкие ворота после КАЖДОГО шага: Senior Pilot показывает вывод
#   и спрашивает, что из этого готово для ЛПР. checks — условия ворот; question — свой вопрос ворот
#   (если есть). Переход ворота не блокируют.
#
# Поля вопроса: id, type (text | number | choice | multi | table), text, why, hint, example,
# options (choice/multi), risky_options — варианты, выбор которых сам становится риском,
# columns и min_rows (table), required (по умолчанию true),
# risk: {level: caution | warning, text} — что будет, если вопрос останется открытым.
# warning — красное табло (ломает прод или защиту), caution — сливовое (нужно закрыть до запуска).
# why — одна фраза, зачем вопрос в маршруте; hint — подсказка к форме ответа; example — пример из другого проекта.
# guide — один-три наводящих вопроса по порядку. Задаются, только если в ответе нет того, что вопрос прямо
#   требует; не больше двух на вопрос; первый открытый, второй с вариантами из ответов Junior Pilot.
#   Наводящий вопрос не содержит готового ответа.
# mentor_note — два-три предложения «зачем это в проде»: что сломается без этого и кто заметит.
#   Показывается один раз на вопрос и только после первой попытки ответа.
# no_sample: true — решение принадлежит Junior Pilot и заказчику. Готовый образец ответа не даётся,
#   только два-три варианта с плюсами, минусами и условием выбора.
# prefill_from — id вопросов, из ответов на которые Senior Pilot собирает черновик ответа; Junior Pilot правит.
# prefill_pattern: true — черновик ответа собирается из карточки выбранного паттерна (patterns.yaml).
# required_rows — подписи обязательных строк таблицы, по порядку сверху (например «главное число ЛПР»).
# extra_text — подпись дополнительной текстовой строки к вопросу с вариантами (например сроки и бюджет).
#
# На шаге Ш1 и в первом отрезке шага Ш2 в вопросах, наводящих и объяснениях нет чисел и расчётов.
