phases:
- id: preflight
  title: Предполётная подготовка
  note: Что болит, где корень, где проходит граница автоматизации и сколько это стоит
  steps:
  - 1
  - 2
- id: design
  title: Конструирование и сборка
  note: Как устроен агент, где человек, что делает система при отказе, прототип и периметр
  steps:
  - 3
  - 4
- id: landing
  title: Испытания и посадка
  note: Проверка качества и атаки, запуск по стадиям, эксплуатация и решение ЛПР
  steps:
  - 5
  - 6
steps:
- id: 1
  code: Ш1
  slug: problem
  title: Проблема
  goal: Чья боль, где её корень и чем это подтверждено следами работы. Без чисел и расчётов.
  lead: Чью работу мы облегчаем, где корень боли и чем это подтверждено следами работы?
  artifact: Постановка проблемы — карточка идеи и лист As-Is
  ready:
  - Идея описана своими словами, понятно, для кого и какую проблему она решает
  - Названы те, кого затронет решение системы, и роль, которая может поддержать проект
  - Описаны 3+ шага процесса, первая строка — событие, с которого начинается работа
  - Названы боль, её причина и шаг, где больнее всего
  - Отмечено, что видно в следах, а что пока предположение
  - Известно, где данные и есть ли случаи с правильным результатом
  level: sketch
  segments:
  - title: Идея
    questions:
    - process
    - why_company
    - who_needs
    - if_nothing
    - success_picture
    - decision_maker
  - title: Как сейчас
    questions:
    - as_is_table
    - bottleneck
    - incidents
    - reality_gap
    - data_where
  questions:
  - id: process
    type: text
    text: 'В чём идея? Расскажите, как рассказали бы коллеге: что приходит на вход, что должно происходить и что получается на выходе.'
    why: С идеи начинается всё остальное. Достаточно двух-трёх фраз — уточнять будем по шагам.
    hint: 'Две-три фразы своими словами: вход, что происходит, выход. Без терминов и расчётов.'
    example: Чтобы система сама разбирала запись совещания, собирала протокол и отмечала в реестре, какие задачи закрыты (проект протоколов совещаний).
    risk:
      level: caution
      text: Идея не описана — дальше нечего уточнять.
    guide:
    - Что приходит на вход и что должно получиться на выходе?
    - Если бы это уже работало, что вы увидели бы утром на экране?
    - Кто сейчас делает это руками?
    mentor_note: Идея словами — черновик постановки задачи, а не её финал. Чем конкретнее вход и выход, тем легче на следующих шагах увидеть, где нужна машина, а где хватит правила.
  - id: why_company
    type: text
    text: Какую проблему решает идея — что сейчас неудобно, долго, дорого или теряется, и почему так происходит?
    why: Проект живёт, пока решает чью-то проблему. Это будущий первый слайд для ЛПР.
    hint: Сначала боль словами, потом её причина — почему так получается.
    example: 'Задачи с совещаний теряются: их держат в голове одно-два совещания, а потом ставят заново.'
    risk:
      level: caution
      text: Не названа проблема — ценность проекта не видна.
    guide:
    - Почему это плохо — что из-за этого происходит дальше?
    - А почему так получается?
    - Это боль одного человека или всей команды?
    mentor_note: Ищем причину, на которую можно повлиять, а не симптом. Автоматизация симптома часто переносит боль на соседний участок, и проект выглядит сделанным, а жалобы остаются.
  - id: who_needs
    type: text
    text: Кто будет пользоваться системой, кто от неё выиграет, кому может прибавиться работы и кого затронет решение системы, хотя он ею не пользуется?
    why: Пользователь, выигравший, тот, кому прибавится работы, и тот, кого касается решение системы, — часто разные люди. Всем четверым должно быть понятно, что изменится.
    hint: Роли тех, кто будет работать с системой, тех, кому станет лучше, тех, кому станет неудобнее, и тех, кого касается решение системы, — исполнителей, контрагентов, клиентов.
    example: Пользуется секретарь и администратор проекта; выигрывает руководитель — видит все задачи и кто за что отвечает; решение системы касается исполнителей — им назначают задачи по записи совещания.
    risk:
      level: caution
      text: Не понятно, для кого проект.
    guide:
    - 'Закончите фразу от лица пользователя: «Когда …, я хочу …, чтобы …»'
    - Кто выигрывает, даже если сам системой не пользуется?
    - Есть ли тот, кому станет неудобнее, или тот, кого решение системы касается, хотя он ею не пользуется?
    mentor_note: 'Пользователь, выгодоприобретатель и тот, кому прибавится работы, — обычно разные люди. Третьего часто забывают, а он может тихо остановить пилот. Четвёртый — тот, кого касается решение
      системы: он должен понимать, что решение подготовила машина, и знать, как его оспорить.'
  - id: if_nothing
    type: text
    text: Что будет, если ничего не делать?
    why: Ответ на этот вопрос ЛПР задаст первым. Сейчас — словами, оценку прикинем на Ш2.
    hint: Опишите, что продолжит происходить и кого это заденет.
    example: Задачи продолжат теряться, а секретарь будет тратить час в день на протокол.
    risk:
      level: caution
      text: Не понятно, почему нельзя оставить как есть.
    guide:
    - Что продолжит происходить через полгода?
    - Кто первым это заметит и как?
    mentor_note: Цена бездействия — первый вопрос ЛПР. Сейчас достаточно слов; оценку прикинем на Ш2, когда процесс будет описан.
  - id: success_picture
    type: text
    text: Как вы поймёте, что стало лучше? Опишите словами, что изменится у пользователя.
    why: Картина успеха словами — заготовка будущих показателей. Мерить будем позже, сейчас важно, что изменится для людей.
    hint: 'Одна-две фразы от лица пользователя: что он перестанет делать вручную или что начнёт видеть.'
    example: Секретарь больше не сводит протокол вручную, а руководитель утром видит, какие задачи закрыты и за кем остальные.
    required: false
    risk:
      level: caution
      text: Не описано, что считать успехом, — KPI выберут по удобству замера.
    guide:
    - Представьте, что задача решается сама и новой системы нет. Что тогда видно?
    - Какую фразу вы хотели бы услышать от пользователя после пилота?
    mentor_note: Картина успеха словами — заготовка будущих KPI. Без неё KPI потом выбирают по тому, что легко посчитать, а не по тому, что важно пользователю. Картина «функция выполняется, а системы нет»
      показывает, какие шаги можно не автоматизировать, а убрать. На Ш2 превратим её в число и способ замера.
  - id: decision_maker
    type: text
    text: Кто в компании может поддержать проект или решить о запуске? Роль, не имя.
    why: Проекту нужен человек, которому он важен. Его число найдём позже, сейчас — кто это.
    hint: Должность или роль. Если не знаете — «Не знаю», подскажу, у кого спросить.
    example: Руководитель, который ведёт ежедневное совещание.
    risk:
      level: caution
      text: Не понятно, кто поддержит проект, — его некому будет показать.
    guide:
    - Кому эта боль стоит денег или нервов?
    - Кто распоряжается временем людей, которых это касается?
    - У кого бюджет, а кто влияет на решение, — это один человек?
    mentor_note: У проекта должен быть заказчик, который отвечает за его обоснование и ради которого готовится защита. Если такого человека нет, проект становится инициативой одного энтузиаста.
  - id: as_is_table
    type: table
    text: Как работа идёт сейчас — по шагам. Первая строка — событие, с которого начинается работа, и кто её делает.
    columns:
    - шаг
    - кто делает (роль)
    - где (программа, место)
    - что неудобно
    min_rows: 3
    why: Чтобы улучшить процесс, надо увидеть его целиком. Событие из первой строки потом станет триггером агента. Минуты и деньги посчитаем позже — сейчас важны шаги и люди.
    hint: 'Первая строка — что запускает работу: письмо, звонок, дата, документ, — и кто её делает. Шаг — «что делаем + с чем + где». Два действия — два шага. Пишите словами, как рассказали бы коллеге.'
    example: 'Совещание началось — слушать и писать заметки · секретарь · Word · в заметки попадает только то, что успели записать

      Свести протокол · секретарь · Word и заметки · протокол готов только на следующий день

      Сверить задачи с прошлым совещанием · секретарь и руководитель · вручную по памяти · задачи теряются'
    risk:
      level: caution
      text: Не описано, как работа идёт сейчас, — непонятно, что улучшать.
    guide:
    - Что запускает работу — письмо, звонок, дата, документ, — и кто её делает?
    - Здесь одно действие или два? Если делают два человека — это два шага.
    - Где работа ждёт, а не делается?
    mentor_note: Описываем то, что делают на деле, а не то, что написано в регламенте. Начинать с события, которое запускает работу, полезно ещё и потому, что именно оно станет триггером агента. Шаги, где
      работа ждёт, часто дают больше выигрыша, чем шаги, где её делают, — их видно только в честной таблице.
    required_rows:
    - событие, с которого начинается работа, и кто её делает
  - id: bottleneck
    type: text
    text: Где сейчас больнее всего и в чём причина?
    why: С этого места, скорее всего, и начнётся автоматизация.
    hint: Назовите шаг из таблицы и причину — почему он болит, а не только как.
    example: 'Сверка задач с прошлым совещанием: по памяти задачи теряются и ставятся заново.'
    risk:
      level: caution
      text: Не названо, где больнее всего, — не ясно, с чего начать.
    guide:
    - Почему именно здесь?
    - А это почему происходит?
    - Если бы этот шаг исчез совсем, что бы сломалось?
    mentor_note: Ищем корень, а не самое заметное место. Если автоматизировать симптом, очередь просто переедет на соседний шаг. С этого места, скорее всего, начнётся ядро агента.
  - id: incidents
    type: text
    text: Что ломалось или шло не так в последнее время? Пара случаев словами.
    why: Реальные случаи подсказывают, где система должна быть особенно аккуратной.
    hint: "Что случилось и чем кончилось. Можно без дат и сумм. Последний случай: когда, что произошло, что сделали. Не «как было бы», а как было."
    example: Имя участника назвали без фамилии — в протоколе ответственным оказался не тот человек.
    risk:
      level: caution
      text: Нет фактов об отказах — таблица отказов будет гаданием.
    required: false
    guide:
    - Чем кончилось и кто заметил?
    - Такое повторяется?
    mentor_note: 'Реальные случаи ценнее придуманных: они станут строками таблицы отказов на Ш3 и проверочными случаями на Ш5. Записанный сейчас случай сэкономит время на каждом из этих шагов.'
  - id: reality_gap
    type: text
    text: Расходится ли то, как работа описана в регламенте, с тем, как её делают на деле?
    why: Расхождение — штатная находка. Его фиксируют в журнал улучшений, а прежнее описание не переписывают задним числом.
    hint: 'Одна-две строки: «по регламенту так — на деле так».'
    example: По регламенту протокол готов в день совещания, на деле — на следующий день.
    required: false
    risk:
      level: caution
      text: Расхождения не отмечены — гипотеза выдаётся за факт.
    guide:
    - Что в регламенте написано про этот шаг?
    - Бывает, что шаг пропускают или делают в другом порядке?
    mentor_note: Расхождение регламента с практикой — штатная находка, а не чья-то вина. Агента строят под практику, но расхождение показывают владельцу процесса, а не исправляют молча.
  - id: data_where
    type: text
    text: Где живут данные, с которыми работает процесс, где остаются следы работы — письма, файлы, журналы — и есть ли прошлые случаи, где известно, каким был правильный результат?
    why: Без данных агенту не с чем работать, по следам позже посчитаем эффект, а прошлые случаи с известным правильным результатом станут набором проверок. Сейчас важно только, где они.
    hint: 'Названия программ и мест: почта, учётная система, папка, таблица, записи звонков, журналы. Объём не нужен. Отдельно — есть ли случаи, где известно, как было правильно, и кто это подтвердит.'
    example: Записи совещаний в папке на сервере, заметки секретаря в Word, реестр задач и его история изменений — в веб-приложении; по прошлым встречам руководитель помнит, какие задачи действительно закрыты.
    risk:
      level: caution
      text: Не ясно, где данные, следы работы и случаи с правильным результатом, — агенту может быть не с чем работать, а эффект и качество нечем проверить.
    guide:
    - Откуда шаг берёт данные и куда кладёт результат?
    - Какие данные или проверки уже есть и сейчас не используются?
    - Есть ли прошлые случаи, где известно, каким был правильный результат, и кто его подтвердит?
    mentor_note: 'Данные — то, с чем будет работать агент, следы — будущий прибор, которым померим эффект. Без следов на Ш2 придётся оценивать потери на глаз. Прошлые случаи с известным правильным результатом
      — самый ценный актив: на них на Ш5 проверяют качество до запуска.'
  synthesis:
    title: Постановка проблемы
    template: 'Кто сталкивается: [who_needs]. Боль и причина: [why_company]. Если ничего не делать: [if_nothing]. Что хотим получить: [process]. По чему поймём: [success_picture]. Поддержать может: [decision_maker]. Решение затронет: [who_needs: кого затронет решение]. Работа начинается с [as_is_table: первая строка — событие и кто делает] и проходит [as_is_table: число шагов] шагов. Больнее всего — [bottleneck: шаг], корень — [bottleneck: причина]. Случаи: [incidents]. Данные и следы: [data_where: где данные и следы]; случаи с известным правильным результатом — [data_where: случаи с правильным результатом]. Расхождение с регламентом: [reality_gap]. Отдельно помечается, что из этого видно в следах, а что пока предположение. Вопрос исследования: можно ли получить [success_picture] для [who_needs]?'
  gate:
    n: 1
    title: Проблема подтверждена
    checks:
    - Названы боль, причина и шаг
    - Отмечено, что видно в следах, а что пока предположение
    - Известно, где данные и есть ли случаи с правильным ответом
- id: 2
  code: Ш2
  slug: solution
  title: Решение и ценность
  goal: Гипотеза решения и гипотеза ценности, проверяемая числом. В первом отрезке — без чисел, во втором числа даются оценкой.
  lead: Где машине действительно нужно решение по ситуации, где остаётся человек и по какому числу мы поймём, что гипотеза верна?
  artifact: Гипотеза решения и ценности — таблица судьбы шагов, лист To-Be, KPI
  ready:
  - Ядро одно, у него названо действие во внешней системе
  - У каждого шага As-Is есть судьба и исполнитель с причиной
  - Названо, где остаётся человек, и свойство работы, которое этого требует
  - Выбран минимальный уровень агентности после сравнения с решением без агента
  - Известны тип тайны и доступ к системе записи
  - У главного числа ЛПР есть «до», цель и замер
  - Критерий успешного прогона записан до первого прогона
  level: project
  no_numbers_segment: 1
  segments:
  - title: Граница
    questions:
    - core_step
    - boundary_table
    - to_be_table
    - human_left
    - write_action
    - access
    - agency_level
    - secret_kind
  - title: Ценность
    questions:
    - loss_now
    - kpi_table
    - success_criterion
    - tradeoff
  questions:
  - id: core_step
    type: text
    text: Какой шаг — кандидат в ядро агента, вокруг которого строится система? Почему он?
    why: Ядро — один шаг. Попытка автоматизировать всё сразу — главная причина, по которой проекты не доходят до пилота.
    hint: "Самый частый ручной шаг, где нужно суждение и есть запись во внешнюю систему. Назовите и то, что ядро сознательно не делает, и что даст право это добавить."
    example: Сопоставить фразы совещания с задачами реестра и отметить выполненные — самая частая ручная работа с суждением.
    risk:
      level: warning
      text: Нет ядра — проект расползается.
    guide:
    - Какой шаг повторяется чаще всего и требует суждения?
    - Если автоматизировать только его — пользователь заметит разницу?
    mentor_note: 'Ядро — один шаг. Попытка автоматизировать всё сразу — главная причина, по которой проекты не доходят до пилота. Начать с ядра легче, чем с полной таблицы: остальные шаги потом раскладываются
      вокруг него.'
    no_sample: true
  - id: boundary_table
    type: table
    text: 'Граница и судьба шагов As-Is: что станет с каждым шагом и кто делает его дальше.'
    columns:
    - шаг As-Is
    - судьба (удалить / схлопнуть с № / перепроектировать / оставить)
    - кто делает дальше (правило / агент / человек)
    - почему
    min_rows: 3
    why: Самый дешёвый шаг — удалённый. Агент дороже правила, медленнее и непредсказуемее — ставить его надо только туда, где решение появляется внутри работы.
    hint: Признаки удаления — шаг не меняет результат для следующего, существует ради отчётности, его и соседний делает подряд один человек. Можно нарисовать шаг блок-схемой — это правило, а не агент.
    example: 'Загрузить файлы · схлопнуть с приёмом · правило · папка-приёмник забирает файл сама, всё проверяется правилом

      Свести протокол · перепроектировать · агент · связать фразу с задачей можно только по смыслу

      Вычитка перед сохранением · перепроектировать · человек · не шлюз, а право проверить после факта

      Разобрать спорных людей · оставить · человек · ошибка портит справочник команды'
    risk:
      level: warning
      text: Нет границы и судьбы шагов — агент окажется там, где хватило бы правила, или получится старый процесс с агентом.
    guide:
    - Какой шаг исчез бы совсем, если бы данные приходили сами?
    - Можно ли нарисовать этот шаг блок-схемой с условиями? Если да — это правило.
    - Что будет, если здесь ошибётся машина, — кто пострадает и сможет ли исправить?
    mentor_note: 'Самый дешёвый шаг — удалённый: агент на месте человека в старом процессе даёт тот же процесс, только дороже. Правило — путь задан заранее, агент — модель сама выбирает путь. Агент дороже
      и непредсказуемее, поэтому его ставят только туда, где решение появляется внутри работы; если шаг можно нарисовать блок-схемой, рисуйте блок-схему.'
  - id: to_be_table
    type: table
    text: Шаги целевого процесса.
    columns:
    - шаг To-Be
    - исполнитель (человек / workflow / агент / RAG-бот)
    - точка контроля (экран)
    - петля возврата — куда и кто адресат
    min_rows: 4
    why: Один исполнитель на шаг — иначе непонятно, кто отвечает. Точка контроля — экран, а не пункт регламента.
    hint: Агентных шагов обычно один-два из пяти-семи. Два исполнителя в клетке — это два шага.
    example: Сформировать протокол · агент · экран «Конфликты» с цитатой и кнопками принять / оставить / своё · при «не прошёл» — карточка администратору проекта.
    risk:
      level: warning
      text: Нет целевого процесса — нечего строить.
    guide:
    - Кто один отвечает за этот шаг?
    - Где человек увидит результат шага — какой экран?
    - Если шаг не прошёл, кому и куда уходит?
    mentor_note: Один исполнитель на шаг — иначе непонятно, кто отвечает. Точка контроля — экран, а не пункт регламента. Агентных шагов обычно один-два из пяти-семи.
  - id: human_left
    type: text
    text: Где в целевом процессе остаётся человек и какое свойство работы этого требует — необратимость, юридическая значимость, нужен контекст людей?
    why: 'Оставленное человеку — спроектированное место, а не недоделка. Это ответ на страх ЛПР «агент натворит»: конкретные решения за человеком снимают возражение лучше любых процентов.'
    hint: Шаг из таблицы границы и причина — свойство работы. «Так надёжнее» — не причина.
    risk:
      level: caution
      text: Не названо, где остаётся человек и почему, — ЛПР увидит «чёрный ящик», а ответственность человека размыта.
    guide:
    - Какой шаг вы не доверили бы даже очень аккуратному новичку?
    - Что делает этот шаг особенным — необратим, юридически значим, нужен контекст людей?
    mentor_note: Оставленное человеку — спроектированное место, а не недоделка. ЛПР обязательно спросит, где человек, и ответ «нигде» его испугает, а ответ «везде» съест чужое время. Причина должна быть
      свойством работы, а не «так надёжнее».
    no_sample: true
  - id: write_action
    type: text
    text: Какое действие агента меняет внешнюю систему — запись, сообщение, задача, файл? Где человек увидит, что оно произошло, не открывая журнал агента?
    why: Агент без рук — это чат. Чтение, поиск и генерация текста действием не считаются, а «агент отчитался» — не доказательство.
    hint: Глагол со следом и место, куда можно заглянуть «вторым окном», не через лог агента.
    example: Агент закрывает задачу в реестре веб-приложения; видно в истории задачи — кто, когда, по какой цитате.
    risk:
      level: warning
      text: Нет действия во внешней системе — показать заказчику нечего.
    guide:
    - Какой глагол — создаёт, закрывает, отправляет, записывает?
    - Куда заглянет заказчик, чтобы убедиться, что действие было?
    mentor_note: Агент без действия во внешней системе — это чат. Доказательство работы — изменение, видимое «вторым окном», а не отчёт самого агента. Это место потом станет демонстрацией для заказчика.
  - id: access
    type: choice
    text: Есть ли машинный доступ к системам, которые агент будет читать и менять (API, токен, кто выдаёт)?
    options:
    - Да — доступ есть и проверен
    - Частично — к части систем
    - Нет — доступа нет
    - Нужна заявка — знаю кому
    risky_options:
    - Нет — доступа нет
    - Нужна заявка — знаю кому
    - Частично — к части систем
    why: Проекты чаще встают на доступе, чем на модели. Выяснить это надо первым, а не последним.
    hint: Проверьте скриптом — один запрос на чтение и один на запись в тестовую запись.
    example: В проекте учётной системы служба читает одну папку и пишет только в базу своей программы; ключи в .env.local вне git.
    risk:
      level: warning
      text: Нет доступа к системе записи — агент не сможет действовать, останется чатом.
    guide:
    - Кто в компании выдаёт доступ к этой системе?
    - Пробовали ли вы читать или писать туда не руками, а программой?
    mentor_note: Проекты чаще встают на доступе, чем на модели. Если выяснить это сейчас, заявка на доступ пойдёт параллельно с проектированием, а не задержит запуск в конце.
  - id: agency_level
    type: choice
    text: Какой уровень агентности нужен ядру?
    options:
    - Хватит правила без модели
    - Один вызов модели с примерами, без цикла
    - Workflow — шаги заданы заранее
    - Агент с фиксированным набором инструментов
    - Агент, который сам расширяет набор инструментов
    - Не знаю
    risky_options:
    - Не знаю
    why: Каждый уровень вверх — дороже отладка, выше риск, больше сопровождения. Брать надо минимальный, что решает задачу, и сначала сравнить с самым простым решением без агента.
    hint: Сначала проверьте самое простое — правило или один вызов модели с примерами. Если их не хватает, в прод почти всегда идёт агент с фиксированными инструментами.
    example: Оба проекта-примера — фиксированный набор инструментов; модель инструменты не выбирает, это сознательный размен ради проверяемых потолков.
    risk:
      level: caution
      text: Уровень агентности не выбран — стоимость и риск не оценены.
    guide:
    - Что даст один вызов модели без цикла и инструментов и чего в нём не хватит?
    - Порядок действий ядра известен заранее или зависит от того, что пришло?
    - Набор инструментов у ядра постоянный или должен меняться?
    mentor_note: 'Каждый уровень вверх — дороже отладка, выше риск, больше сопровождения. Прежде чем выбирать агента, сравните с самым простым: правилом и одним вызовом модели с примерами. Если простое
      даёт почти то же, сложность не окупится. В прод почти всегда идёт агент с постоянным набором инструментов: это сознательный размен свободы на проверяемость.'
    no_sample: true
  - id: secret_kind
    type: choice
    text: Что у вас тайна — данные или процесс? Какие ещё есть ограничения — сроки, бюджет?
    options:
    - Тайна в процессе — всё локально
    - Тайна в данных — гибрид с фильтром персональных данных перед внешней моделью
    - Тайны нет — всё по API
    - Не знаю
    risky_options:
    - Не знаю
    why: 'От ответа зависит, где будет работать модель, поэтому он нужен до выбора модели на шаг. Псевдонимизация — не анонимизация: людей опознают по трём полям.'
    hint: Спросите владельца данных, а не инженера. Сроки и бюджет — словами, без сумм.
    example: Голос и ФИО — тайна, поэтому распознавание только локально; в облачный мониторинг уходят только числа вызовов, без текста и ФИО — закреплено тестом. Сроки — к ближайшему кварталу, бюджет на
      модели ограничен.
    risk:
      level: warning
      text: Тип тайны не определён — режим размещения выбран наугад.
    guide:
    - Что хуже утечёт — сами данные или то, как устроен процесс?
    - Есть ли в данных ФИО, паспорта, суммы сделок, условия договоров?
    - Кто в компании владеет этими данными?
    mentor_note: 'От ответа зависит весь режим размещения, поэтому вопрос стоит до выбора паттерна и модели: переделка после стоит дороже, чем вопрос сейчас. Спрашивать надо владельца данных, а не инженера.
      Сроки и бюджет здесь словами, суммы появятся во втором отрезке шага и на Ш4.'
    extra_text: Сроки и бюджет — словами
  - id: loss_now
    type: text
    text: Примерно сколько времени или денег уходит на эту работу сейчас — в неделю или месяц? Оценкой.
    why: Первое число проекта. Процесс уже описан, поэтому оценить проще. Точнее замерим перед запуском.
    hint: Минуты на одно действие × сколько раз в неделю. Не знаете — «Не знаю», замер станет первой задачей.
    example: Протокол — около часа секретаря в день; задачи теряются и ставятся заново.
    risk:
      level: caution
      text: Потеря не оценена — ценность проекта пока нечем показать.
    guide:
    - Сколько минут уходит на одно такое действие?
    - Сколько раз в неделю оно повторяется?
    mentor_note: Первое число проекта. Процесс уже описан, поэтому оценить проще, чем на Ш1. «Примерно» и «не знаю» принимаются — замер станет первой задачей перед пилотом.
  - id: kpi_table
    type: table
    text: 'KPI проекта. Первая строка — главное число ЛПР: по нему ЛПР поймёт, что проект удался.'
    columns:
    - KPI
    - значение «до» (из As-Is)
    - цель
    - чем мерить
    min_rows: 2
    why: У ЛПР своё число, и оно пойдёт на первый слайд защиты. KPI без «до» нельзя проверить, цель без способа замера — пожелание.
    hint: "Первая строка — число, которое ЛПР уже видит в отчётах, и его значение сейчас, пусть примерно. «Не хуже» — тоже цель, если назван замер. Рядом с главным числом — каким будет ложный успех: число растёт, а пользы нет."
    example: 'Доля закрытий задач без ручного ввода (главное число ЛПР) · 0 % · ≥ 90 % · журнал закрытий по цитате

      Время от расшифровки до протокола · 60 мин · ≤ 10 мин · время в журнале сборки'
    risk:
      level: warning
      text: KPI не заданы — эффект не доказать, защита держится на словах.
    guide:
    - Какую фразу из картины успеха на Ш1 можно превратить в число и видит ли ЛПР его в каком-нибудь отчёте?
    - Чем будете мерить — откуда возьмётся значение?
    - Какое число не должно ухудшиться, пока растёт главное?
    mentor_note: 'Лучше всего, если главное число ЛПР уже знает: тогда не нужно объяснять, что оно значит. KPI без значения «до» нельзя проверить, цель без способа замера — пожелание. Второй KPI обычно
      сторожит качество, пока первый растёт.'
    required_rows:
    - главное число ЛПР
  - id: success_criterion
    type: text
    text: Что считается успешным результатом одного прогона? Запишите до первого прогона.
    why: Критерий, выбранный после прогонов, подгоняется под результат. Стоимость успешного результата без него не посчитать.
    hint: Проверяемо кодом или человеком за минуту. HTTP 200 — не успех.
    example: Успех — протокол сохранён и ни один факт потом не откатили, либо обоснованный отказ по реальной причине. HTTP 200 сам по себе успехом не считается.
    risk:
      level: warning
      text: Нет критерия успеха — стоимость результата и качество не измерить.
    guide:
    - Как за минуту понять, что один прогон удался?
    - Что считать честным отказом, а не провалом?
    mentor_note: Критерий, выбранный после прогонов, подгоняется под результат. Без него не посчитать стоимость успешного результата на Ш5. Ответ сервера «200» успехом не считается.
  - id: tradeoff
    type: text
    text: 'Что улучшится и что при этом может ухудшиться — время проверки, доверие, нагрузка на соседний участок? Можно ли развести эти требования, чтобы не выбирать одно: по условию, во времени, между
      частями системы?'
    why: У каждого улучшения есть цена. Названный размен становится вторым показателем, который сторожит главный.
    hint: 'Одна строка «улучшится — может ухудшиться» и способ развести: по условию, во времени или между частями системы.'
    example: 'Улучшится полнота протокола, может вырасти время проверки у администратора. Разводим по условию: человек смотрит только спорные цитаты, остальное проверяется после факта.'
    required: false
    risk:
      level: caution
      text: Размен не назван — ухудшение заметят пользователи, а не проект.
    guide:
    - Какое число не должно упасть, пока растёт главное?
    - В какой ситуации важнее первое требование, а в какой — второе?
    mentor_note: Не ищите середину между требованиями — сначала попробуйте их развести. По условию — человек проверяет только необратимое и спорное; во времени — сначала тень, потом самостоятельно; по частям
      — модель предлагает, код проверяет. Если развести нельзя, размен называется явно, и второй KPI сторожит то, что ухудшится.
  synthesis:
    title: Гипотеза решения и ценности
    template: 'Ядро — [core_step], уровень — [agency_level]. У каждой строки [as_is_table] есть судьба и исполнитель в [boundary_table]. Агент [write_action: глагол] в [write_action: система], это видно
      в [write_action: место]. Человек остаётся на [human_left: шаг], потому что [human_left: свойство работы]. Доступ — [access]. Тайна — [secret_kind]; сроки и бюджет — [secret_kind: сроки и бюджет].
      Если [core_step] делает агент, то [kpi_table: главное число ЛПР] изменится с [kpi_table: значение до] до [kpi_table: цель]. Поймём по [kpi_table: чем мерить]. Сейчас теряем [loss_now]. Успех прогона
      — [success_criterion]. Что может ухудшиться и как это разведено — [tradeoff].'
  gate:
    n: 2
    title: Обоснование
    checks:
    - Ядро одно
    - У каждого шага As-Is есть судьба и исполнитель
    - Известны тип тайны и доступ
    - У главного числа есть «до», цель и замер
    - Критерий успеха записан до прогона
- id: 3
  code: Ш3
  slug: architecture
  title: Устройство и контроль
  goal: Самое простое устройство с правами, пределами, точками остановки и поведением при отказе.
  lead: Какое самое простое устройство решит задачу ядра, где у него пределы и что оно сделает, когда сломается самое вероятное?
  artifact: Схема агента, паспорт инструментов, контур управления и таблица отказов
  ready:
  - Паттерн выбран задачей, у него три ответа — кто решает, где предел, что после
  - У каждого инструмента минимальные права ключа, класс повтора и урезанное лишнее
  - Условие запуска — событие, расписание или внешний вызов, не кнопка
  - Модель назначена на каждый шаг с причиной, критичная логика живёт в коде
  - На необратимых шагах есть остановка, и человек видит ровно исполняемое действие
  - У спорного есть адресат и срок, у ручной очереди — тот, кто её разбирает
  - В таблице отказов есть плохой вход и действие наполовину; повтор не создаёт дублей; замок стоит на данных
  level: design
  segments:
  - title: Устройство
    questions:
    - trigger
    - pattern
    - pattern_answers
    - tools_table
    - rules_layer
    - model_per_step
  - title: Человек и отказы
    questions:
    - control_table
    - quality_gate
    - stop_point
    - escalation
    - failures_table
    - idempotency
    - concurrency
  questions:
  - id: trigger
    type: text
    text: Условие запуска без человека — событие, расписание или внешний вызов? Где оно записано?
    why: Кнопка, «захожу утром и запускаю», «открываю чат» — не автономность. На демонстрации это видно сразу.
    hint: Узел-триггер, планировщик ОС, вебхук. Запуск из редактора не считается.
    example: Файл появился в папке-приёмнике. Четыре стопа автозапуска со своим объяснением человеку — протокол уже собран, расшифровка уже приложена, файл вида «прочее», дата в имени не совпадает.
    risk:
      level: warning
      text: Нет триггера — система работает только пока человек нажимает кнопку.
    guide:
    - Что сейчас запускает работу — вы записали это первой строкой таблицы As-Is на Ш1?
    - Где это событие записано так, чтобы программа его увидела?
    mentor_note: 'Кнопка или «захожу утром и запускаю» — не автономность, на демонстрации это видно сразу. Триггер начинать проще всего: обычно это то же событие, с которого начинается работа сейчас.'
  - id: pattern
    type: choice
    text: Какой паттерн у системы?
    options:
    - Один агент с инструментами
    - Router — маршрутизатор
    - Конвейер с валидатором
    - Supervisor + субагенты
    - Agentic RAG
    - Parallel — веер
    - Генератор и оценщик
    why: Паттерн определяет, где деньги, где предел и что ломается. «Supervisor, чтобы выглядело агентнее» — лишние вызовы без добавленной работы.
    hint: Начните с самого простого из подходящих. Входы разного типа — router. Стыки проверяются правилом — конвейер с валидатором. Черновик улучшается по кругу под ясный критерий, который проверяет вторая
      модель, — генератор и оценщик. Этапы зависят от предыдущего — supervisor. База знаний с неизвестным числом заходов — agentic RAG.
    example: Протоколы совещаний — конвейер с валидаторами кодом; учётная система — router из 4 веток, выбранный кодом по состоянию базы, дальше конвейер «черновик → проверка».
    risk:
      level: warning
      text: Паттерн не выбран — не ясно, где предел и кто решает.
    guide:
    - Входы бывают разных типов или все похожи?
    - Шаги идут подряд и каждый можно проверить правилом?
    - Начните с самого простого — какой паттерн проще всех из подходящих?
    mentor_note: Паттерн определяет, где деньги, где предел и что ломается. «Supervisor, чтобы выглядело агентнее» — лишние вызовы без добавленной работы. Усложнять устройство стоит только тогда, когда
      простое решение доказуемо не справляется.
  - id: pattern_answers
    type: text
    text: Три ответа паттерна для вашего случая — кто решает, где предел, что после предела?
    why: Если хоть один ответ пустой, это сценарий, собранный на глаз, а не паттерн.
    hint: По одной строке на ответ, своими словами.
    example: Решает валидатор кодом по результату шага; предел — 1 повтор проверки; после — карточка в очередь «Системные сообщения» супер-администратору.
    risk:
      level: caution
      text: У паттерна нет предела или исхода — тихая потеря прогонов.
    guide:
    - Кто решает, что шаг прошёл, — код или модель?
    - Что происходит после предела — куда уходит прогон?
    mentor_note: 'Если хоть один из трёх ответов пустой, это сценарий, собранный на глаз, а не паттерн. Самый частый пробел — «что после предела»: прогон тихо теряется.'
    prefill_pattern: true
  - id: tools_table
    type: table
    text: Инструменты агента.
    columns:
    - инструмент
    - чтение или запись
    - система
    - права ключа (минимально нужные)
    - класс повтора (безопасен / с ключом идемпотентности / недопустим без подтверждения)
    - лишнее урезано (функция / право / самостоятельность)
    min_rows: 2
    why: Что умеет ключ, то умеет агент. Надпись «только чтение» — этикетка, замок — права ключа. Лишнее урезают здесь, а атака на Ш5 это только проверяет.
    hint: Создать тикет, разослать уведомление, выложить документ — по умолчанию «повтор недопустим». В последней колонке — «нужно — …; лишнее — …».
    example: 'Папка-приёмник · чтение · файловая система · одна папка · безопасен · лишнего нет

      Реестр задач · запись · база приложения · только свои таблицы · с ключом «отпечаток файла + дата встречи» · нужно — закрыть задачу, лишнее — удалить; учётка только на свои таблицы, а не на всю базу'
    risk:
      level: warning
      text: Права инструментов не урезаны — агент может больше, чем нужно, и инъекция превратится в действие.
    guide:
    - Какое самое узкое право нужно этому инструменту?
    - Что агент может сделать, хотя задаче это не нужно?
    - Что будет, если этот вызов повторится дважды?
    mentor_note: Что умеет ключ, то умеет агент. Надпись «только чтение» — этикетка, замок — права ключа. Лишнюю функцию, лишнее право и лишнюю самостоятельность урезать сейчас дешевле, чем потом находить
      атакой. Отправку, создание и публикацию по умолчанию считают «повтор недопустим».
  - id: rules_layer
    type: text
    text: Где живут правила агента — промпт, навык, хук, код? Какие правила критичны и поэтому стоят в коде?
    why: Промпт не секрет и не замок. Правило со словом «всегда» живёт в коде.
    hint: Перечислите 2–3 критичных правила и слой каждого.
    example: Модель выдумывала статусы и закрывала задачи, поставленные в том же документе; помогли только запреты в коде.
    risk:
      level: warning
      text: Критичная логика в промпте — обходится инъекцией или забывается моделью.
    guide:
    - Какое правило у вас со словом «всегда» или «никогда»?
    - Что будет, если модель его забудет?
    mentor_note: 'Промпт не секрет и не замок. Правило со словом «всегда» живёт в коде: модель забывает инструкции, а инъекция их обходит. Случай из практики — модель закрыла все задачи, поставленные на
      той же встрече, и помог только запрет в коде.'
  - id: model_per_step
    type: table
    text: Модель на каждый шаг.
    columns:
    - шаг
    - класс модели (топовая / рабочая / лёгкая / локальная)
    - причина
    min_rows: 1
    why: «Одна модель на всё, так проще» — не причина. Проектируют на топовой, запускают на лёгкой там, где шаг идёт по правилу.
    hint: Три вопроса — придумать или выполнить по правилу; сколько раз повторяется; сколько стоит ошибка. Проверяющая модель — другого семейства.
    example: Генерация — рабочая модель, температура 0,2; извлечение поручений и проверка — температура 0; проверка на другом сервере и другом семействе моделей.
    risk:
      level: caution
      text: Модели не назначены — стоимость и качество не управляются.
    guide:
    - Этот шаг придумывает или выполняет по правилу?
    - Сколько стоит ошибка на этом шаге?
    - Можно ли по типу тайны с Ш2 отдавать этот шаг внешней модели?
    mentor_note: «Одна модель на всё, так проще» — не причина. Проектируют на сильной модели, запускают на лёгкой там, где шаг идёт по правилу. Проверяющая модель — другого семейства, иначе она повторит
      ошибку проверяемой.
  - id: control_table
    type: table
    text: Контур управления по шагам.
    columns:
    - шаг
    - обратимость (обратимый / необратимый / проверить)
    - точка контроля (нет / посмотреть / утвердить / поправить)
    - кто (роль)
    - почему этот тип
    min_rows: 3
    why: Тип точки определяется правами человека, а не строгостью. Точка на каждом шаге — чужое время, точка нигде — риск.
    hint: Проверка обратимости — «через десять минут пойму, что ошибка, — отменю сам?». Норма — 2–3 точки на 5–7 шагов.
    example: Закрытие задачи по цитате · обратимый · посмотреть после факта · администратор проекта · ошибку видно в карточке, откат одной кнопкой; Пересборка протокола, которого касался человек · необратимый
      · утвердить · администратор · нельзя перезаписать работу человека.
    risk:
      level: warning
      text: Нет точек контроля на необратимых шагах — ошибка уходит наружу без остановки.
    guide:
    - Если через десять минут поймёте, что здесь ошибка, — отмените сами?
    - Здесь человек только смотрит или может поменять?
    mentor_note: Тип точки определяется правами человека, а не строгостью. Точка на каждом шаге — чужое время, точка нигде — риск. Обычная норма — две-три точки на процесс.
  - id: quality_gate
    type: text
    text: Quality gate — какое машинное условие проверяем и что делаем, если оно не выполнено?
    why: Без второй половины это не гейт, а пожелание. Условие проверяет машина — формат, порог, совпадение с источником, политика.
    hint: «Условие → действие» — задержать, эскалировать, заблокировать, отказать с объяснением.
    example: Нет цитаты в источнике этой встречи → статус не меняется; отрицание или будущее время → задача не закрывается; задача поставлена на этой же встрече → закрыть её нельзя.
    risk:
      level: caution
      text: Нет quality gate — брак проходит дальше молча.
    guide:
    - Представьте, что модель сослалась на то, чего в источнике нет. Что увидит человек?
    - Что делаем с результатом, который не прошёл, — задержать, показать с пометкой, отказать?
    mentor_note: Машинная проверка нужна не вместо человека, а чтобы до человека не доходил брак, который ловится правилом. Без второй половины — «что делаем, если не выполнено» — это не гейт, а пожелание.
  - id: stop_point
    type: text
    text: Покажите место, где выполнение физически останавливается до «да» человека. Видит ли человек на экране ровно то действие с параметрами, которое исполнится?
    why: Формальный HITL — точка, где изменить ничего нельзя, или «спроси меня» в промпте. Подтверждение защищает, только если человек видит ровно то, что исполнится.
    hint: 'Название экрана или узла и ровно какое действие исполнится после «да»: адресат, сумма, запись — те же значения, что уйдут в вызов.'
    example: Экран «Конфликты» — цитата из записи, предложенное значение, кнопки «принять / оставить / своё / закрыть»; без нажатия значение не меняется. Текст для экрана и для вызова берётся из одного
      поля.
    risk:
      level: warning
      text: Точка контроля формальная — человек ничего не может остановить.
    guide:
    - Что исполнится сразу после нажатия «да»?
    - Текст на экране и параметры вызова берутся из одного поля?
    - Что, если человек нажимает «да», не глядя, — как вы это заметите?
    mentor_note: 'Формальная точка контроля — та, где изменить ничего нельзя, или «спроси меня» в промпте. Если экран показывает описание, а вызов берёт другие параметры, человек подтверждает одно, а происходит
      другое. Второй риск — привычка подтверждать не глядя: её мерят долей правок.'
  - id: escalation
    type: text
    text: Эскалация и ручная очередь — адресат (одна роль), срок, что делает система после срока, кто ещё узнаёт; что попадает в ручную очередь, кто её разбирает, как часто и что считается разобранным?
    why: «Кто-нибудь из команды» и «до конца дня» — это не эскалация. Исход просрочки — решение бизнеса, а не инженера. Очередь без разбирающего — папка «потом».
    hint: Законные исходы просрочки — безопасный вариант по умолчанию, подъём выше, деградация. Для очереди — что попадает, кто разбирает, как часто, что значит «разобрано» и что делать, если она растёт.
    example: Адресат — администратор проекта; срок — до следующей встречи; после срока ничего не ломается, карточка висит в счётчике меню. В очередь попадают спорные люди и конфликты источников; разбирает
      администратор до следующей встречи.
    risk:
      level: caution
      text: Нет эскалации и хозяина очереди — зависшие решения и отказы копятся незаметно.
    guide:
    - Кто один получает спорный случай?
    - Что делает система, если он не ответил к сроку?
    - Что попадает в ручную очередь и что значит «разобрано»?
    mentor_note: '«Кто-нибудь из команды» и «до конца дня» — не эскалация. Исход просрочки — решение бизнеса: безопасный вариант по умолчанию, подъём выше или видимая деградация. Ручная очередь — место,
      куда сходятся все отказы; у неё возраст самого старого элемента важнее размера.'
    no_sample: true
  - id: failures_table
    type: table
    text: 'Таблица отказов. Две строки обязательны: плохой вход (ловим до модели) и действие, выполненное наполовину.'
    columns:
    - шаг
    - что сломается
    - как узнаю (машинный признак)
    - что делает система
    - кто и когда узнаёт
    - паттерн — условие · предел · что после
    min_rows: 3
    why: Плохой ответ стоит вашего времени, плохое действие — чужого. Мусорный вход отсекается до платного вызова модели, а половина сделанного часто хуже, чем ничего.
    hint: Паттерны — повтор, запасной путь, видимая деградация, ручная очередь, компенсирующее действие. «Мне сообщат» — не признак. Для действия наполовину — компенсируем, дорабатываем вручную или откатываем;
      компенсация — не отменить, а выполнить обратное.
    example: 'Приём файла · плохой вход — двоичный мусор в .txt · проверка формата · отклонён до модели, 0 вызовов · человек видит причину словами · отказ до модели

      Сводка закрытий · действие выполнено наполовину — сбой второго запроса · ошибка ответа · протокол сохраняется · недостающая часть уходит карточкой администратору · дозапись вручную

      Вызов модели · 429 / 5xx · код ответа · повтор · журнал · повтор до 4 попыток с растущей задержкой, дальше очередь

      Ответ модели · не JSON · ошибка разбора · 1 повтор с напоминанием о формате · журнал · после — карточка человеку'
    risk:
      level: warning
      text: Отказы не описаны — первый сбой в проде остановит процесс молча.
    guide:
    - Что на этом шаге ломается чаще всего — сеть, формат ответа, сама система?
    - По какому признаку плохой вход ловится до модели?
    - Что хуже в вашем случае — половина сделана или ничего не сделано?
    mentor_note: 'Плохой ответ стоит вашего времени, плохое действие — чужого. «Мне сообщат» — не признак: признак видит машина. Случаи, записанные на Ш1, — готовые строки этой таблицы. Плохой вход — самый
      частый отказ, а действие наполовину — самый коварный: для него заранее проектируют обратное действие.'
    prefill_from:
    - incidents
    required_rows:
    - плохой вход (ловим до модели)
    - действие выполнено наполовину
  - id: idempotency
    type: text
    text: Ключ идемпотентности — по какому устойчивому ключу система узнаёт, что это то же самое действие?
    why: Повтор без ключа превращает одну ошибку сети в два письма подрядчику или две задачи в реестре.
    hint: Ключ из бизнес-полей — «номер пункта + строка программы», «отпечаток файла + дата».
    example: Отпечаток содержимого файла — дубль не принимается; дата закрытия равна дате встречи; протокол помнит, из каких источников собран.
    risk:
      level: warning
      text: Нет идемпотентности — повтор создаёт дубли во внешней системе.
    guide:
    - Если тот же запрос придёт дважды, по чему система поймёт, что это то же самое?
    - Какие поля из бизнеса не меняются при повторе?
    mentor_note: Повтор без ключа превращает одну ошибку сети в два письма подрядчику или две задачи в реестре. Ключ берут из бизнес-полей, а не из времени запроса.
  - id: concurrency
    type: text
    text: Что будет, если два запуска придут одновременно — на один и тот же объект и на разные? Где стоит замок?
    why: 'Гонки находят пользователи, а не тесты: два параллельных прогона закрывают одну задачу дважды или затирают друг друга.'
    hint: Замок ставится на данные, а не на кнопку. Назовите объект замка, лимит параллельных прогонов и что видит второй запрос.
    example: Медленная проверка ответа затирала параллельный ответ — потерянное «Не знаю» нашлось прямо на диске; после замка на данные проекта и слияния со свежим состоянием 100 параллельных записей —
      0 потерь.
    risk:
      level: warning
      text: Гонки не продуманы — параллельные запуски теряют или дублируют данные.
    guide:
    - Что будет, если двое нажмут одновременно на один и тот же объект?
    - Где стоит замок — на кнопке или на данных?
    mentor_note: Гонки находят пользователи, а не тесты. Замок на кнопке защищает только от одного окна; два окна, два пользователя или повтор по сети его обходят. Замок ставят на данные.
  synthesis:
    title: Устройство и контроль
    template: 'Запуск — [trigger]. Паттерн — [pattern]: решает [pattern_answers: кто решает], предел — [pattern_answers: где предел], после — [pattern_answers: что после предела]. Инструменты: [tools_table:
      перечень с правами]; лишнее урезано: [tools_table: лишнее урезано]. Критичные правила в коде: [rules_layer]. Модели: [model_per_step: кратко по шагам]. Необратимы шаги [control_table: необратимые
      шаги]. На них человек [control_table: тип точки] на экране [stop_point: экран] и видит [stop_point: что видит человек]. До человека машина проверяет [quality_gate]. Спорное уходит [escalation: адресат]
      со сроком [escalation: срок]; после срока [escalation: исход]; очередь разбирает [escalation: кто разбирает очередь] [escalation: как часто]. Плохой вход ловим [failures_table: плохой вход] до модели.
      Самые вероятные отказы: [failures_table: две-три главные строки]. Действие наполовину — [failures_table: действие выполнено наполовину]. Повтор не создаёт дублей благодаря ключу [idempotency]; одновременные
      запуски разводит замок на [concurrency: объект замка].'
  gate:
    n: 3
    title: Конструкция выдерживает отказ
    question: Что сделает система, если сломается самое вероятное?
    checks:
    - У паттерна есть все три ответа
    - Права минимальны
    - На необратимых шагах есть остановка
    - У спорного есть адресат и срок
    - Повтор не создаёт дублей
    - Замок стоит на данных
- id: 4
  code: Ш4
  slug: prototype
  title: Прототип и периметр
  goal: Тонкий срез работает на стенде с потолками, а периметр готов к вопросам ИБ.
  lead: Работает ли самый тонкий срез от триггера до действия, что его остановит, если он пойдёт вразнос, и что из наших данных покидает периметр?
  artifact: Прототип (схема и каркас), лист потолков, лист «Где живёт агент», ответы ИБ
  ready:
  - Прототип прогнан на трёх входах с ожиданием до прогона, действие видно во внешней системе
  - У каждого потолка число, источник, исход и проверенное место, где он стоит
  - «Остановлено по пределу» различимо в статусе, ветке и журнале
  - У агента есть адрес для проверок и атак
  - Режим размещения выбран по шагам, «что уходит наружу» названо сущностями
  - Условия провайдера и сторонних компонентов подтверждены, ответы ИБ закрыты
  level: design
  segments:
  - title: Прототип
    questions:
    - stack
    - seed_cases
    - prototype_run
    - endpoint
    - limits_table
    - limit_outcome
  - title: Периметр
    questions:
    - hosting_table
    - vendor_terms
    - audit_log
    - key_rotation
    - security_checklist
  questions:
  - id: stack
    type: choice
    text: На чём собираем?
    options:
    - Python — рабочий агент; n8n — наглядный прототип
    - Только Python
    - Только схема n8n для обсуждения
    why: Наглядная схема ускоряет согласование с заказчиком, рабочий код — то, что пойдёт в прод.
    hint: Схема n8n — для разговора с ЛПР и быстрых проб; потолки, идемпотентность и журнал проще держать в коде.
    example: Оба проекта-примера работают на Python; схемы использовались для объяснения потока заказчику.
    risk:
      level: caution
      text: Стек не выбран — сроки и сопровождение не оценены.
    guide:
    - Кому нужно показать схему — заказчику или себе?
    - Где проще держать потолки и журнал — в схеме или в коде?
    mentor_note: Наглядная схема ускоряет согласование, рабочий код — то, что пойдёт в прод. Потолки, идемпотентность и журнал проще держать в коде.
  - id: seed_cases
    type: table
    text: На каких трёх входах прогоним прототип первым и что ожидаем на каждом? Запишите до прогона.
    columns:
    - вход
    - ожидаемый результат
    - как поймём, что совпало
    min_rows: 3
    why: Ожидание, записанное после прогона, подгоняется под результат. Эти три входа станут началом набора проверок на Ш5.
    hint: Три входа — типовой, трудный и такой, где правильный ответ — отказ. Ожидание пишется до первого прогона.
    example: 'Запись совещания с тремя поручениями · три задачи в реестре с ответственными и сроками · задачи видны в реестре с цитатой

      Ответственный назван только по имени, в команде есть тёзки · задача создана без исполнителя, карточка оператору с подсказками · карточка в очереди, исполнитель пуст

      Фраза «это мы потом как-нибудь обсудим» · задача не создаётся · новых задач в реестре нет'
    risk:
      level: caution
      text: Прототип прогнан без ожиданий — «работает» держится на впечатлении.
    guide:
    - Какой вход самый типовой?
    - Какой случай из Ш1 ломал процесс раньше?
    - На каком входе правильный ответ — отказ?
    mentor_note: 'Ожидание, записанное после прогона, подгоняется под результат. Три входа — начало набора проверок Ш5: типовой, трудный и такой, где правильно отказать. Записать их до первого прогона стоит
      минут, а экономит спор «работает или нет».'
  - id: prototype_run
    type: choice
    text: Прошёл ли тонкий срез целиком — триггер, вызов, действие во внешней системе — на трёх входах, записанных выше?
    options:
    - Да — видно вторым окном
    - Частично — работает, но только в логе
    - Нет ещё
    risky_options:
    - Частично — работает, но только в логе
    - Нет ещё
    why: Пока действие не видно во внешней системе, проекта для заказчика нет — есть демонстрация текста.
    hint: Запуск по триггеру → вызов инструмента → изменение во втором окне; результат сверен с ожиданием на каждом входе.
    example: Файл положен в папку-приёмник → через 2–4 минуты в реестре задача закрыта с цитатой, видно в истории задачи.
    risk:
      level: warning
      text: Прототип не прогнан — архитектура не проверена реальностью.
    guide:
    - Что вы увидели во втором окне?
    - Совпал ли результат с ожиданием на каждом из трёх входов?
    mentor_note: Пока действие не видно во внешней системе, проекта для заказчика нет — есть демонстрация текста. Прогон до потолков нужен ещё и потому, что потолки ставятся по наблюдаемому максимуму, а
      его без прогона нет.
  - id: endpoint
    type: text
    text: Адрес агента для проверок и атак (стенд, не прод) — метод, поле входа, поле ответа.
    why: По этому адресу на Ш5 прогоняются набор проверок и атаки. Контракт «запрос → ответ».
    hint: Например — POST http://localhost:8100/run, вход в поле query, ответ в поле answer.
    example: 'POST http://localhost:8100/run · {"query": "..."} → {"answer": "...", "status": "done | stopped_by_limit | queued", "cost_usd": 0.03}'
    risk:
      level: caution
      text: Нет адреса агента — проверки и атаки придётся делать вручную.
    guide:
    - Какой метод и какое поле входа?
    - Есть ли в ответе статус — «сделано», «остановлено по пределу», «в очереди»?
    mentor_note: По этому адресу на Ш5 прогоняются проверки и атаки. Статус в ответе позволяет отличить успех от предела без чтения журнала.
  - id: limits_table
    type: table
    text: Потолки одного прогона.
    columns:
    - потолок (шаги / деньги / время / артефакты / размер входа)
    - значение
    - откуда число
    - что при достижении
    - кто разбирает очередь
    - где физически стоит и как проверено, что срабатывает
    min_rows: 3
    why: Агентный цикл не имеет естественного конца. Значение «как стояло в платформе» — не обоснование, а потолок «в документе» не работает.
    hint: 'Наблюдаемый максимум × 1,5–2. Меняете один потолок — пересчитайте остальные. Для слабой модели — «оценка плюс один», не «чтобы хватило». Для денег — где реально стоит счётчик: в коде, лимит ключа
      у провайдера, шлюз.'
    example: 'вызовы · 14 · наблюдаемый максимум 10–11 × 1,3 · остановка до вызова, статус «остановлено по пределу» · администратор проекта · счётчик в коде, проверен прогоном с заниженным потолком

      деньги · 0,40 $ · максимум 0,228 $ × 1,75 · то же · то же · счётчик стоимости в коде до каждого вызова плюс лимит ключа у провайдера 100 $ в месяц, платные прогоны останавливаются на 90 $

      размер запроса · 400 000 знаков · максимум 218 147 × 1,8 · отказ до сети · то же · проверка в коде до сети, проверена атакой на разгон стоимости'
    risk:
      level: warning
      text: Потолков нет или они только на бумаге — один зацикленный прогон съедает месячный бюджет.
    guide:
    - Какой максимум вы видели на прогонах?
    - Что произойдёт в момент, когда потолок достигнут?
    - Где физически стоит счётчик денег и как вы проверили, что он срабатывает?
    mentor_note: Агентный цикл не имеет естественного конца. Потолок — наблюдаемый максимум с запасом в полтора-два раза; «как стояло в платформе» — не обоснование. В no-code платформах денежного потолка
      внутри сценария нет, есть только лимит ключа у провайдера, поэтому место потолка проверяют отдельно.
  - id: limit_outcome
    type: text
    text: Как «остановлено по пределу» отличается от «сделано» — ветка, статус записи, признак в журнале?
    why: Предел без исхода хуже отсутствия предела — создаёт видимость порядка. Известен случай, когда превышение итераций уходило в ветку успеха.
    hint: Вторая ветка смысла, статус «остановлено по пределу, шаг N», признак «итерация 5 из 5». Повтор после предела запрещён.
    example: У каждого исхода свой класс — limit, SetupError (человеку показывается настоящая причина, например «не задан ключ»), ProviderUnavailable (повтор имеет смысл).
    risk:
      level: warning
      text: Предел неотличим от успеха — потери не видны.
    guide:
    - Чем статус «остановлено по пределу» отличается от «сделано» в записи?
    - Может ли прогон после предела попасть в ветку успеха?
    mentor_note: Предел без исхода хуже отсутствия предела — создаёт видимость порядка. Известен случай, когда превышение итераций уходило в ветку успеха и потери не были видны неделями.
  - id: hosting_table
    type: table
    text: Где живёт каждый шаг.
    columns:
    - шаг
    - режим (API / своё железо / гибрид)
    - что уходит наружу (сущности)
    - что остаётся в контуре
    - цена в месяц по формуле
    min_rows: 2
    why: Режим выбирается по шагам, а не на весь процесс. «Локально» не значит безопасно и не значит бесплатно.
    hint: Цена API — вход_млн × цена_входа + выход_млн × цена_выхода; у агентной нагрузки вход больше выхода в разы. Своё железо — главный расход — инженер.
    example: Распознавание голоса · своё железо · ничего · запись, ФИО · 0 $ сверх железа; Генерация протокола · сначала API, потом свой сервер · на API уходила расшифровка с ФИО, хранение у провайдера
      до 30 дней — поэтому переезд.
    risk:
      level: warning
      text: Не ясно, что уходит наружу, — служба ИБ остановит проект.
    guide:
    - Какие поля уходят в модель на этом шаге?
    - Что из них нельзя показывать никому вне компании?
    mentor_note: 'Режим выбирается по шагам и по типу тайны с Ш2, а не по деньгам; цену прогона измерим на Ш5. «Локально» не значит безопасно и не значит бесплатно: главный расход своего железа — инженер.'
  - id: vendor_terms
    type: text
    text: 'Условия провайдера модели и сторонних компонентов — коннекторов, плагинов, серверов инструментов: хранение, обучение, кто выпускает, как закреплена версия — чем подтверждены?'
    why: «Не обучаемся» не значит «не смотрим». Заявление проверяется договором, независимого аудита вендоров нет.
    hint: Тип аккаунта (подписка или ключ API), срок хранения, как отключено обучение, ссылка на договор. Для стороннего компонента — кто выпускает, как закреплена версия, какой у него ключ.
    example: Запрет моделей, которые обучаются на данных, стоит в коде до вызова; срок хранения у провайдера — 30 дней, поэтому данные с ФИО на API не отправляются; сторонних коннекторов нет — все инструменты
      свои.
    risk:
      level: caution
      text: Условия провайдера и сторонних компонентов не проверены — возможна утечка по договору или через чужое обновление.
    guide:
    - У вас подписка или ключ API?
    - Где в договоре написано про хранение и обучение?
    - Кто выпускает этот компонент и что будет, если он обновится без вас?
    mentor_note: '«Не обучаемся» не значит «не смотрим». Заявление провайдера проверяется договором, независимого аудита поставщиков нет. Сторонний компонент получает права вашего агента: закрепите его
      версию и дайте ему отдельный минимальный ключ.'
  - id: audit_log
    type: text
    text: Журнал аудита — где записано, кто (человек или агент), когда и что изменил во внешней системе, и сколько он хранится?
    why: Первый вопрос ИБ и аудита к агенту, который пишет в учётные системы. Без журнала спорное действие не разобрать.
    hint: Кто, что, когда, по какому основанию (цитата или правило), срок хранения, кто имеет доступ к журналу.
    example: История задачи — кто закрыл (агент или человек), дата, цитата из записи встречи, которая стала основанием.
    risk:
      level: warning
      text: Нет журнала аудита — спорное действие агента не восстановить.
    guide:
    - Если завтра спросят, кто закрыл эту запись, — где посмотрите?
    - Отличается ли в журнале действие агента от действия человека?
    mentor_note: Первый вопрос ИБ и аудита к агенту, который пишет в учётные системы. Без журнала спорное действие не разобрать, и всю вину возьмёт на себя агент.
  - id: key_rotation
    type: text
    text: Ключи и токены агента — кто выпускает, где хранятся, как часто меняются и что делать при утечке?
    why: Ключ агента — это его права. Утёкший ключ без процедуры отзыва делает все остальные контроли формальными.
    hint: Где хранится (переменные окружения, хранилище секретов), срок жизни, кто отзывает, как проверить, что старый ключ больше не работает.
    example: Ключи только в .env.local вне git; лимит ключа у провайдера 100 $ в месяц; при утечке — отзыв в кабинете провайдера и перевыпуск.
    risk:
      level: caution
      text: Нет процедуры ротации ключей — утечка останется незамеченной.
    guide:
    - Где хранится ключ агента?
    - Как проверите, что отозванный ключ больше не работает?
    mentor_note: 'Ключ агента — это его права. Утёкший ключ без процедуры отзыва делает все остальные контроли формальными. Хранение секретов — часть среды, а не сдачи: к запуску процедура уже должна работать.'
  - id: security_checklist
    type: text
    text: Ответы службе ИБ — права токена, что уходит наружу, режим размещения, scope пилота, где живёт критичная логика.
    why: Это пять вопросов, которые зададут первыми. Чек-лист, скачанный из интернета, их не закрывает.
    hint: По строке на вопрос. Тип тайны — с Ш2; рамку пилота окончательно задаём на Ш6, здесь — черновик. Если проверить нечем — так и напишите, это тоже ответ.
    example: Ключ читает одну папку и пишет только в свою базу; наружу — только числа; всё на своих серверах; пилот 2 недели, 3 человека; запреты на статусы — в коде.
    risk:
      level: warning
      text: ИБ-вопросы не закрыты — запуск остановится на согласовании.
    guide:
    - Какой из пяти ответов вы не сможете показать документом?
    - Что ИБ спросит первым именно у вас?
    mentor_note: Это пять вопросов, которые ИБ задаст первыми. Почти всё уже сказано на прошлых шагах, поэтому здесь важна не формулировка, а то, чем каждый ответ подтверждён.
    prefill_from:
    - tools_table
    - hosting_table
    - secret_kind
    - pilot_scope
    - rules_layer
  synthesis:
    title: Прототип и периметр
    template: 'Стек — [stack]. Тонкий срез прогнан на [seed_cases: число входов] входах, совпало [prototype_run: сколько совпало с ожиданием]; действие видно в [prototype_run: где видно действие]. Адрес
      для проверок и атак — [endpoint]. Потолки: [limits_table: ключевые потолки]; деньги ограничены [limits_table: где стоит денежный потолок]; предел отличается от успеха [limit_outcome]. Наружу уходит
      [hosting_table: что уходит наружу], остаётся [hosting_table: что остаётся в контуре]. Провайдер и сторонние компоненты — [vendor_terms: условия и чем подтверждены]. Журнал аудита — [audit_log]. Ключи
      — [key_rotation]. Ответы ИБ — [security_checklist].'
  gate:
    n: 4
    title: Прототип действует
    checks:
    - Действие видно во втором окне на трёх входах
    - Предел отличим от успеха
    - Известно, что уходит наружу
    - Ответы ИБ подтверждены
- id: 5
  code: Ш5
  slug: trials
  title: Проверка и атаки
  goal: Доказать качество, цену принятого результата и устойчивость к чужому тексту.
  lead: Чем мы докажем, что система делает обещанное, сколько стоит один принятый результат и что худшее она может сделать с чужим текстом?
  artifact: Протокол качества и испытаний с ценой принятого результата
  ready:
  - 10–15 случаев всех четырёх типов, у каждого ожидаемый результат до прогона и судья
  - Судья сверен с разметкой человека, журналы прогонов прочитаны
  - Стоимость успешного результата посчитана на своих прогонах с долей неудачных и повторами
  - Регрессия на одном наборе до и после изменения, расхождения разобраны
  - Атаки прогнаны на стенде с боевыми потолками, ожидание записано до запуска
  - Найденное исправлено и прогнано повторно
  level: calc
  segments:
  - title: Качество
    questions:
    - eval_table
    - judge_calibration
    - runs_table
    - break_even
    - regression
  - title: Атаки
    questions:
    - untrusted_inputs
    - attack_target
    - attack_selection
    - attack_expectations
    - attack_findings
  questions:
  - id: eval_table
    type: table
    text: Набор проверочных кейсов.
    columns:
    - тип (типовой / пограничный / невалидный / отказ-эскалация)
    - вход
    - ожидаемый результат
    - признак прохождения
    - судья (код / модель / человек)
    min_rows: 10
    why: «Погонял — работает» не проверка, самооценка модели завышена. Ожидаемый результат пишется до прогона.
    hint: Код проверяет всё, что может. Модель-судью калибруют по разметке человека. «В документах этого нет» — тоже правильный ответ.
    example: 'типовой · «накладную пока не получили, будем согласовывать» · черновик принят · clean == true · код

      пограничный · в черновике «19 октября», в источнике «9» · существенная находка · в находке есть «19» · код

      невалидный · двоичный мусор в .txt · отклонён до модели · 0 вызовов · код

      отказ · «Мы её потом что будем согласовывать?» · вопрос не становится задачей · задач 0 · код'
    risk:
      level: warning
      text: Нет набора проверок — качество держится на впечатлении.
    guide:
    - Какого из четырёх типов кейсов у вас пока меньше всего?
    - Откуда ожидаемый результат — кто его решил?
    mentor_note: «Погонял — работает» — не проверка, а самооценка модели завышена. Ожидаемый результат пишется до прогона. Код проверяет всё, что может; модель-судья — только там, где код бессилен.
    prefill_from:
    - seed_cases
    - incidents
    - failures_table
  - id: judge_calibration
    type: text
    text: Если судья — модель, как он откалиброван по разметке человека? Кто читал журналы прогонов целиком и что нашли?
    why: Прибор врёт чаще продукта. Непроверенный судья ставит «пройдено», когда модель заблокировала черновик по другой причине.
    hint: Сколько случаев размечено человеком, процент совпадения судьи; кто читал журналы целиком и сколько «провалов» оказались ошибкой проверки.
    example: Вердикт засчитывается, только если в находке есть заранее записанное ключевое слово дефекта — защита от ложного «пройдено».
    required: false
    risk:
      level: caution
      text: Судья не откалиброван — результаты проверки могут быть ложными.
    guide:
    - Сколько случаев разметил человек и в скольких судья с ним согласился?
    - Кто читал журналы прогонов целиком и что там нашли?
    mentor_note: 'Прибор врёт чаще продукта. Судья-модель без калибровки ставит «пройдено», когда результат правильный по другой причине. Его проверяют сразу после набора, до серии прогонов, и читают несколько
      журналов целиком: часть «провалов» окажется ошибкой проверки.'
  - id: runs_table
    type: table
    text: Серия прогонов для стоимости успешного результата.
    columns:
    - №
    - вход
    - успешно? (да / нет)
    - цена прогона $
    min_rows: 5
    why: ЛПР интересует цена принятого результата, а не цена вызова. Стоимость = цена прогона × число прогонов ÷ число успешных.
    hint: Пять разных входов, критерий успеха — с Ш2, записан заранее. Тот же вход стоит прогнать несколько раз.
    example: Четыре успешных прогона — 0,3512 + 0,1461 + 0,1123 + 0,1537 $ → 0,19 $ за успешный результат; один честный отказ стоит в среднем 0,353 $ — в 1,8 раза дороже успеха.
    risk:
      level: warning
      text: Стоимость результата не посчитана — главный аргумент защиты отсутствует.
    guide:
    - Критерий успеха — тот, что записан на Ш2?
    - Тот же вход прогоняли несколько раз — все повторы успешны?
    - Сколько стоил неудачный прогон по сравнению с удачным?
    mentor_note: 'ЛПР интересует цена принятого результата, а не цена вызова. Неудачные прогоны входят в цену: стоимость — сумма всех прогонов, делённая на число успешных. Один удачный прогон ничего не
      говорит о надёжности: для системы, которая работает с людьми, важно, чтобы были успешны все повторы.'
  - id: break_even
    type: text
    text: Расчёт — токенов в месяц на входе и выходе, цена API, цена своего железа, порог, с которого своё дешевле.
    why: «Своё дешевле, уже куплено» — частая ошибка. Цены без даты и источника устаревают; расчёт наследует худшую метку из входных чисел.
    hint: Вывод одной строкой — «при N млн токенов API стоит X, своё Y; сравняются при Z».
    example: Стоимость одного прогона на API — несколько центов; при 20 прогонах в месяц это единицы долларов, а свой сервер оправдан требованием периметра, а не деньгами.
    required: false
    risk:
      level: caution
      text: Нет расчёта — решение о размещении не защитить перед финансами.
    guide:
    - Сколько прогонов в месяц будет в пилоте?
    - С какого объёма своё железо дешевле API?
    mentor_note: «Своё дешевле, уже куплено» — частая ошибка. Расчёт имеет смысл после того, как стоимость прогона измерена, а не оценена, — поэтому он здесь, рядом с серией прогонов. Цены без даты и источника
      устаревают.
  - id: regression
    type: text
    text: Что меняли и что показал тот же набор до и после изменения?
    why: Разные наборы «до» и «после» ничего не доказывают. Насытившаяся проверка уходит в регрессию.
    hint: Изменение, результат до, результат после, что разобрано в журнале улучшений.
    example: Смена проверяющей модели — на коротких кейсах все проверки пройдены; на полном прогоне модели нашли меньше половины настоящих ошибок; два класса ошибок перенесли в код — находок стало больше, без ложных
      тревог.
    risk:
      level: caution
      text: Регрессии нет — любая правка промпта может тихо сломать качество.
    guide:
    - Что меняли последним?
    - Тот же набор был до и после?
    mentor_note: Разные наборы «до» и «после» ничего не доказывают. Насытившаяся проверка уходит в регрессию и сторожит, чтобы правка промпта не сломала то, что работало.
  - id: untrusted_inputs
    type: text
    text: Откуда к агенту приходит текст, который писал не ваш сотрудник, — письма, документы контрагентов, веб-страницы, загруженные файлы?
    why: Самая частая атака на агента идёт не через чат, а через данные, которые он читает. Без перечня источников непонятно, что испытывать.
    hint: Перечислите входы, которые пишет внешний человек, и в каком виде они приходят — текст, PDF, скан, вложение.
    example: Расшифровки совещаний — говорят и приглашённые подрядчики; письма заказчика, которые прикладывают к протоколу; любые файлы, положенные в папку-приёмник.
    risk:
      level: warning
      text: Источники чужого текста не названы — инъекцию через данные не проверить.
    guide:
    - Какой из источников данных, названных на Ш1, пишет внешний человек?
    - Может ли в документ попасть текст, который не видно глазом?
    mentor_note: 'Самая частая атака на агента — не через чат, а через данные, которые он читает: инструкция внутри договора или письма. Пока источники не названы, непонятно, что испытывать.'
  - id: attack_target
    type: text
    text: Где проводим испытания — адрес стенда и чем он отделён от прода (копия базы, тестовые ключи)?
    why: Атаки — реальные запросы. На проде они меняют данные и тратят деньги.
    hint: Отдельная копия базы, отдельный ключ с низким лимитом, адрес стенда.
    example: Все атаки — на копии базы; потолки при атаках только занижали, никогда не выключали.
    risk:
      level: warning
      text: Стенд не отделён от прода — испытания могут испортить рабочие данные.
    guide:
    - Это копия базы или рабочая?
    - Ключ стенда отдельный и с низким лимитом?
    mentor_note: Атаки — реальные запросы. На проде они меняют данные и тратят деньги. Потолки на стенде занижают, но никогда не выключают.
  - id: attack_selection
    type: multi
    text: Какие атаки прогоняем?
    options:
    - Инъекция инструкций через входные данные
    - Лишние права и действия вне задачи
    - Разгон стоимости
    - Повтор того же действия
    - Утечка системного промпта и секретов
    - Мусорный и огромный вход
    - Отказ зависимого сервиса (вручную)
    - Вывод как команда для нижестоящей системы
    why: У каждого класса атак свой контроль. Атака, которую не прогнали, остаётся гипотезой.
    hint: Минимум — разгон стоимости, инъекция и лишние права.
    example: Лишние права — на экране у администратора проекта не было ни одного элемента смены ролей, но прямой запрос «повысить до админа» давал 200. Проверять запрос, а не экран.
    risk:
      level: warning
      text: Атаки не выбраны — уязвимости найдут пользователи.
    guide:
    - Какая атака опаснее всего для вашего источника чужого текста?
    - 'Минимум — разгон стоимости, инъекция и лишние права: все три выбраны?'
    mentor_note: У каждого класса атак свой контроль. Атака, которую не прогнали, остаётся гипотезой. Атака «лишние права» проверяет то, что урезано в паспорте инструментов на Ш3.
  - id: attack_expectations
    type: text
    text: Что должно произойти на каждую выбранную атаку? Запишите до запуска.
    why: Ожидание после прогона подгоняется под результат.
    hint: По строке на атаку — какой контроль сработает и куда уйдёт прогон.
    example: Разгон стоимости — остановка до сети по потолку размера запроса, расход 0 $, в журнале причина; повтор — второй запуск на ту же встречу отклоняется блокировкой.
    risk:
      level: caution
      text: Нет ожиданий — результат атак не с чем сравнить.
    guide:
    - Какой контроль должен сработать первым?
    - Куда уйдёт прогон — отказ, очередь, предел?
    mentor_note: 'Ожидание после прогона подгоняется под результат. По строке на атаку: какой контроль сработает и куда уйдёт прогон.'
  - id: attack_findings
    type: text
    text: Что нашли, что исправили, что показал повторный прогон?
    why: Находка без исправления и повторного прогона — запись в реестре рисков, а не закрытый вопрос.
    hint: Заполняется после прогона; протокол испытаний приложение соберёт само.
    example: Атака на параллельность — два запроса на разные встречи прошли одновременно, потолка не было; в тот же день добавлен лимит 2 и очередь, повторный прогон — вторая генерация ждёт.
    required: false
    risk:
      level: caution
      text: Находки не закрыты повторным прогоном.
    guide:
    - Что сработало не так, как ожидали?
    - Повторный прогон после исправления был?
    mentor_note: Находка без исправления и повторного прогона — строка реестра рисков, а не закрытый вопрос.
  synthesis:
    title: Протокол качества и испытаний
    template: 'Набор — [eval_table: число случаев] случаев, типы [eval_table: распределение по типам]; судья [judge_calibration: код или модель, калибровка], журналы прочитаны [judge_calibration: кто читал
      и что нашли]. Пройдено [eval_table: пройдено] из [eval_table: всего]. Стоимость принятого результата — [runs_table: стоимость успешного результата] при доле неудачных [runs_table: доля неудачных].
      Размещение окупается [break_even]. Регрессия: [regression: изменение — до — после]. Чужой текст приходит из [untrusted_inputs]. На стенде [attack_target] прогнаны [attack_selection]; урезанное на
      Ш3 проверено атакой «лишние права». Ожидали [attack_expectations: кратко], сработало [attack_findings: что сработало]. Найдено и исправлено [attack_findings: находки], повторный прогон — [attack_findings:
      итог повторного прогона].'
  gate:
    n: 5
    title: Испытания пройдены
    checks:
    - Набор проверок четырёх типов с ожиданием до прогона
    - Судья сверен
    - Цена результата посчитана
    - Атаки прогнаны на стенде, находки исправлены и прогнаны повторно
- id: 6
  code: Ш6
  slug: launch
  title: Запуск и сдача
  goal: На каких условиях система работает без нас и какое решение нужно от ЛПР.
  lead: На каких условиях система работает без нас, как мы узнаем, что она портится, и какое решение нужно от ЛПР сейчас?
  artifact: Реестр рисков, план запуска и эксплуатации, пакет для ЛПР
  ready:
  - Scope пилота — дата, число людей, шаг
  - Три стадии — тень, человек в контуре, самостоятельно — и критерий каждого перехода числом
  - 5–7 рисков именно этого процесса, у каждого контроль и владелец-роль
  - Названы предмет мониторинга, признак дрейфа входа и канал обратной связи от пользователя
  - Названы ответственный за починку, выключатель, порог отката и проверенное восстановление
  - Сформулировано одно решение, которое просим у ЛПР, и число, ради которого
  level: calc
  segments:
  - title: Запуск
    questions:
    - pilot_scope
    - rollout_table
    - risk_table
    - monitoring
    - input_drift
  - title: Эксплуатация и сдача
    questions:
    - operations
    - restore_tested
    - ownership
    - user_feedback
    - delivery_package
    - decision_ask
  questions:
  - id: pilot_scope
    type: text
    text: Scope пилота — когда, кому (число людей), на каком шаге?
    why: «Пилот на паре человек» без дат не измерим. Ограниченная рамка — ответ ЛПР на «как это в массы».
    hint: Дата начала и конца, число людей, номер шага To-Be, режим (тень или человек в контуре).
    example: 2 недели, 3 человека, только локальный контур; шаги — протокол, проверка, запись в реестр; режим тени — официальный протокол пишет секретарь.
    risk:
      level: caution
      text: Пилот не ограничен — результат нельзя сравнить и защитить.
    guide:
    - Сколько людей и на какой срок?
    - Режим тени или человек в контуре?
    mentor_note: 'Ограниченная рамка — ответ ЛПР и ИБ на вопрос «как это в массы». Это первая стадия запуска: без дат и числа людей пилот не измерить и не защитить.'
  - id: rollout_table
    type: table
    text: Запуск по стадиям.
    columns:
    - стадия (тень / человек в контуре / самостоятельно)
    - условие перехода — числом
    - что остаётся за человеком
    min_rows: 3
    why: Автономию открывают стадиями. «Когда все привыкнут» и «через месяц» — не критерии.
    hint: "Например — «совпадение с решением человека не ниже 90 % на 20 прогонах подряд». Самостоятельно — это под мониторингом, а не без человека. Критерий меряют, когда спал интерес к новинке, — не по первой неделе."
    example: 'тень → человек в контуре · за неделю 0 больших ошибок; набор кейсов пройден почти целиком; результат в срок в 4 случаях из 5 · официальный документ пишет сотрудник

      человек в контуре → самостоятельно · 4 недели без больших ошибок; оператор тратит ≤ 10 мин на случай; проверка находит заметную долю ошибок · спорные случаи остаются за человеком'
    risk:
      level: warning
      text: Нет критериев перехода — автономия включится «по ощущению».
    guide:
    - Какое число покажет, что можно переходить из тени к человеку в контуре?
    - Что остаётся за человеком на последней стадии?
    mentor_note: Автономию открывают стадиями. «Когда все привыкнут» и «через месяц» — не критерии. «Самостоятельно» — это под мониторингом, а не без человека.
  - id: risk_table
    type: table
    text: Реестр рисков.
    columns:
    - действие
    - риск — что может сломаться
    - митигация — какой контроль ловит
    - владелец (роль)
    min_rows: 5
    why: «Модель может галлюцинировать» — не строка реестра. Строка — «агент делает X, если не проверен Y».
    hint: Владелец — роль. «Система» и «все» владельцем не бывают. Риски Ш3 — контур управления и отказы — становятся строками здесь.
    example: Назначить исполнителя · неверный исполнитель (тёзка, имя без фамилии), 3 отказа из 3 · спорное имя не подставляется, задача без исполнителя и карточка с подсказками · администратор проекта
    risk:
      level: warning
      text: Нет реестра рисков — главная причина отмены проектов не закрыта.
    guide:
    - Какое действие агента дороже всего при ошибке?
    - Кто один отвечает за этот риск?
    mentor_note: «Модель может галлюцинировать» — не строка реестра. Строка — «агент делает X, если не проверено Y». Всё, что на маршруте осталось «не знаю», уже здесь, с владельцем.
    prefill_from:
    - failures_table
    - control_table
    - attack_findings
  - id: monitoring
    type: text
    text: Где по каждому запуску видно шаги, стоимость и ошибки?
    why: Мониторинг отвечает «работает ли», наблюдаемость — «почему агент решил так». «Запуск состоялся» — не мониторинг.
    hint: Лог по строке на шаг — время, результат, токены, цена; или трейсы.
    example: Журнал вызовов — шаг, модель, время, токены, вид сбоя; в облачный мониторинг уходят только числа, без текста.
    risk:
      level: caution
      text: Нет мониторинга — сбой в проде заметят пользователи, а не вы.
    guide:
    - Где по одному запуску видно шаги, стоимость и ошибки?
    - Можно ли понять, почему агент решил так, а не иначе?
    mentor_note: Мониторинг отвечает «работает ли», наблюдаемость — «почему решил так». «Запуск состоялся» — не мониторинг.
  - id: input_drift
    type: text
    text: Как заметим, что входные данные изменились — новый формат документа, новый поставщик, другой язык? Что тогда делает система?
    why: Набор проверок устаревает вместе с входом. Дрейф входа — тихая причина деградации, которую регрессия не ловит.
    hint: Признак дрейфа (доля отказов разбора, новые поля, рост ручной очереди), порог и действие — пополнить набор, сообщить владельцу.
    example: 'Шаблон правила: доля отказов разбора за неделю вдвое выше обычной → владельцу входа уходит сообщение, в набор проверок добавляются новые образцы входа, регрессия прогоняется заново.'
    risk:
      level: caution
      text: Дрейф входа не отслеживается — качество падает незаметно.
    guide:
    - Что изменится, если поменяется формат входящего документа?
    - Какое число первым это покажет?
    mentor_note: Набор проверок устаревает вместе с входом. Дрейф — тихая причина деградации, которую регрессия не ловит, потому что регрессия проверяет старые входы.
  - id: operations
    type: text
    text: Эксплуатация — кто чинит (агент упал в выходные — кто?), что мониторим, условие отката, способ отката?
    why: Поздний рубильник — одна из трёх причин громких провалов автоматизации. Откат стадии — не откат действия.
    hint: Роль, предмет мониторинга (ссылка на журнал мониторинга этого шага), порог отката числом, выключатель.
    example: Чинит инженер сопровождения, 2–3 ч в неделю; откат на ступень после первой большой ошибки; решает супер-администратор; способ — выключатель автозапуска.
    risk:
      level: warning
      text: Нет плана эксплуатации — после сдачи система останется без хозяина.
    guide:
    - Агент упал в субботу — кто узнает и кто починит?
    - Какое число включает откат?
    mentor_note: 'Поздний рубильник — одна из главных причин громких провалов автоматизации. Откат стадии — не откат действия: нужен выключатель и порог, при котором его нажимают.'
  - id: restore_tested
    type: text
    text: Восстановление данных — откуда, сколько времени занимает и когда его последний раз реально проверяли?
    why: Откат, который ни разу не проверяли, откатом не считается. Тест или агент однажды попадут в рабочую базу.
    hint: Источник копии, частота, время восстановления, дата последней проверки, кто проверял.
    example: Автокопия базы при каждом запуске; восстановление испытано дважды после того, как тесты дважды за два дня попали в рабочую базу.
    risk:
      level: warning
      text: Восстановление не проверено — после сбоя данные могут не вернуться.
    guide:
    - Когда восстановление проверяли последний раз?
    - Сколько оно заняло?
    mentor_note: Откат, который ни разу не проверяли, откатом не считается. Тест или агент однажды попадут в рабочую базу, и проверенное восстановление окупится в тот же день.
  - id: ownership
    type: text
    text: Владение — что делаем при смене или снятии модели, кто перепроверяет, как вносится правка промпта?
    why: Первый вопрос финансистов — сколько стоит в эксплуатации. Вендор снимает модели с окном 60–114 дней.
    hint: Правка промпта → новая версия → прогон набора «до / после». Сверка модели раз в квартал.
    example: Перед любой сменой модели или промпта инженер прогоняет набор проверок — 2 ч, 0 $.
    risk:
      level: caution
      text: Не продумано владение — стоимость эксплуатации не ясна.
    guide:
    - Кто прогоняет набор проверок перед сменой модели?
    - Что будет, если провайдер снимет модель?
    mentor_note: Первый вопрос финансистов — сколько стоит в эксплуатации. Вендоры снимают модели с окном в несколько месяцев, и правка промпта без прогона набора — та же смена модели.
  - id: user_feedback
    type: text
    text: Как пользователь сообщит, что система ошиблась, кто разберёт этот случай и как он попадёт в набор проверок?
    why: Ошибки, о которых пользователь не может сообщить, обсуждают в коридоре, а система о них не знает. Случай с известным правильным ответом — готовая строка набора проверок.
    hint: Действие пользователя (кнопка, письмо, карточка), кто разбирает (роль), как часто и как случай попадает в набор проверок.
    example: Кнопка «Неверно» в карточке задачи — случай уходит администратору проекта; после разбора вход и правильный результат добавляются в набор проверок и прогоняются в регрессии.
    risk:
      level: caution
      text: Нет канала обратной связи — ошибки в работе не возвращаются в набор проверок.
    guide:
    - Сколько действий нужно пользователю, чтобы сообщить об ошибке?
    - Кто разберёт такой случай и как он попадёт в набор проверок?
    mentor_note: 'Пользователь должен сообщать об ошибке в одно действие, а этот случай — попадать в набор проверок. Так ошибка работает на проект дважды: исправлена и больше не повторится незаметно.'
  - id: delivery_package
    type: multi
    text: Что передаём заказчику?
    options:
    - Код или экспорт сценария
    - Схема работы агента
    - Паспорт проекта (документы шагов Ш1–Ш6)
    - Инструкция по запуску и откату
    - Журнал прогонов и протокол испытаний
    - Запись демонстрации действия во внешней системе
    why: Сдача — это пакет, по которому другой инженер поднимет и починит систему без вас.
    hint: Демонстрация должна показывать действие во внешней системе, а не текст ответа.
    example: Пакет — код обеих частей, база-образец, инструкция запуска, журнал прогонов, запись демонстрации.
    risk:
      level: caution
      text: Пакет сдачи неполный — заказчик не сможет сопровождать систему.
    guide:
    - Сможет ли другой инженер поднять систему по пакету без вас?
    - Показывает ли запись демонстрации действие во внешней системе?
    mentor_note: Сдача — пакет, по которому другой инженер поднимет и починит систему. Демонстрация показывает действие во внешней системе, а не текст ответа.
  - id: decision_ask
    type: text
    text: Какое одно решение просим у ЛПР и ради какого числа?
    why: Защита заканчивается просьбой. Просить надо «часть уже выделенного бюджета» или «разрешение на следующую стадию», а не «бюджет на агентов».
    hint: Глагол, объём, срок и число, которое ЛПР получит.
    example: Перевести пилот в стадию «человек в контуре» на 4 недели ради 96 % закрытий задач системой и протокола в день встречи даже без секретаря.
    risk:
      level: warning
      text: Нет просьбы — защита закончится без решения.
    guide:
    - Какое одно решение нужно от ЛПР, чтобы перейти к следующей стадии?
    - Какое число с Ш2 и Ш5 стоит за этой просьбой?
    mentor_note: Защита заканчивается просьбой. Просить надо разрешение на следующую стадию или часть уже выделенного бюджета, а не «бюджет на агентов». Просьба — последний вопрос маршрута, потому что опирается
      на все числа.
    no_sample: true
  synthesis:
    title: Итог маршрута
    template: 'Пилот — [pilot_scope]. Запуск: тень — [rollout_table: критерий перехода к человеку в контуре] — человек в контуре — [rollout_table: критерий перехода к самостоятельной работе] — самостоятельно.
      Главные риски: [risk_table: три строки с владельцами]. Мониторинг — [monitoring: где]; дрейф входа ловим по [input_drift: признак]. Чинит [operations: роль], откат при [operations: порог отката],
      восстановление проверено [restore_tested: дата проверки, дд.мм.гггг]. Владение — [ownership]. Об ошибках пользователь сообщает [user_feedback: как], случай попадает в набор проверок [user_feedback:
      как попадает в набор]. Передаём [delivery_package]. Просим у ЛПР [decision_ask] ради [decision_ask: число].'
  gate:
    n: 6
    title: Решение ЛПР
    checks:
    - Стадии с числовыми критериями
    - У рисков есть владельцы
    - Есть выключатель и проверенное восстановление
    - Сформулирована одна просьба с числом
levels:
  sketch:
    title: Набросок
    expect: 'Только слова: что, зачем, кто, где, как сейчас. Ни чисел, ни расчётов не требуй — проект только рождается.'
  project:
    title: Проект
    expect: Конкретные решения словами. В первом отрезке шага Ш2 («Граница») чисел нет; во втором («Ценность») числа появляются только оценкой — «примерно» и «не знаю» принимаются.
  design:
    title: Конструкция
    expect: 'Правила, права, пределы и исходы: что делает система при отказе, где останавливается, кто разбирает.'
  calc:
    title: Расчёт и защита
    expect: 'Числа, замеры, стоимость и критерии: то, что пойдёт на слайд ЛПР.'
