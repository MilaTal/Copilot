# «Находки из прошлых полётов» — обезличенные грабли двух проектов-образцов.
# 11.10.2026: шаги пересчитаны на маршрут из 6 шагов; добавлены обезличенные находки по готовым продуктам рынка.
hints:
  - title: Количество слов не мерит качество
    step: 1
    text: >-
      Решили, что одна расшифровка «на треть длиннее — значит другая теряет речь». Самый короткий источник оказался
      самым чистым, а у «худшей» выгрузки были настоящие ФИО в 365 строках из 366. Мера по тройкам слов давала 74 %
      «нового» на одном и том же звуке; после перехода на смысловые основы — 28 % и 14 %.
    lesson: Меру проверяют на парах с известным ответом до того, как ей верить.
  - title: Запасной путь упал раньше потолка
    step: 3
    text: >-
      Запись об ошибке падала на кодировке консоли, и сообщение в журнал терялось. Потолок был, но исход до него не доходил.
    lesson: Сначала убедиться, что путь к потолку не ломается, потом проверять сам потолок.
  - title: «Всегда» живёт в коде, а не в промпте
    step: 3
    text: >-
      Модель выдумывала статусы задач, а в проверочном прогоне закрыла все задачи, поставленные в том же
      документе. Инструкции в промпте не помогли, помогли только запреты в коде.
    lesson: Критичное правило — проверка кодом до записи, а не просьба к модели.
  - title: Фильтр выбросил верную находку
    step: 5
    text: >-
      Черновик по чужому источнику прошёл проверку чистым. На живых данных за 172 проверки фильтр не сработал ни разу —
      поймал только набор регрессии.
    lesson: Прибор врёт чаще продукта. Набор проверок с известными ответами нужен до доверия живым данным.
  - title: Код знал причину и молчал
    step: 4
    text: >-
      Человек видел «что-то пошло не так», а настоящая причина «не задан ключ» уходила только в журнал.
    lesson: Причину отказа, которую код знает, показывают человеку словами.
  - title: Экран чист, запрос открыт
    step: 5
    text: >-
      У администратора проекта на экране не было ни одного элемента смены ролей, но прямой запрос «повысить до админа»
      возвращал 200, а «создать пользователя-админа» — 201.
    lesson: Права проверяют запросом, а не по экрану.
  - title: Параллельные запросы обходили потолок
    step: 5
    text: >-
      Два запроса на разные встречи шли одновременно без ограничения; 40 одновременных неверных паролей обходили блокировку входа.
    lesson: Замок ставится на данные и на число параллельных работ, а не на кнопку.
  - title: Тест портил рабочую базу
    step: 6
    text: >-
      За два дня тесты дважды попали в рабочую базу. После этого — предохранитель в тестах, отладка только на копии,
      автобэкап при запуске и дважды испытанное восстановление.
    lesson: Откат, который ни разу не проверяли, откатом не считается.

  # --- Шаг 1 · Проблема ---
  - title: Цифры поставщика не сходятся сами с собой
    step: 1
    text: >-
      В пресс-релизе поставщика — 8 млн обработанных заказов, на его же сайте — 2 млн. О внедрениях другой платформы
      в стройке одни источники пишут, что в системе работают 97 % сотрудников клиента, другие — 7 %, и называют разные компании.
    lesson: Расхождение источников показывают, а не выбирают удобную цифру; в постановку проблемы идёт только подтверждённое.
  - title: Боль живёт на стыке систем
    step: 1
    text: >-
      В стройке факт уже оцифрован в актах и журналах, графики ведутся в своей системе, деньги — в учётной, а прогноз
      срыва и оплаты к факту не подключены. Рынок разрезан на «глаз», «график» и «деньги», стык делает сам заказчик.
    lesson: Ищите, где данные уже есть, но не связаны — это готовый ресурс и часто вся ценность проекта.
  - title: Выход описали словами источника
    step: 1
    text: >-
      Правовые системы дают ленту изменений законодательства, а заказчику нужен ответ, какой его продукт, договор
      или процесс затронут и кто должен что сделать. Лента не закрывает боль, хотя сделана хорошо.
    lesson: Выход системы описывают в терминах заказчика — что затронуто и кто действует, а не что изменилось в источнике.
  - title: Хранилище уже построено
    step: 1
    text: >-
      Девелопер заказал ИИ-аналитика, а незадолго до этого у него запустили хранилище из пяти источников, среди них 1С,
      с 11 витринами. Значительная часть работы уже сделана, и в постановке её надо назвать первой.
    lesson: Прежде чем проектировать агента, спросите, что уже собрано; ИИ-аналитик строится поверх готового, а не рядом.
  - title: Контроль по дате, а не по смыслу
    step: 1
    text: >-
      Контроль поручений в документообороте закрывается по сроку и формальному отчёту «выполнено». Проверки, что отчёт
      действительно закрывает поручение, нет ни в одной из ведущих систем.
    lesson: Мерить нужно функцию (поручение исполнено), а не операцию (отчёт приложен).
  - title: Спрос, которого ещё нет
    step: 1
    text: >-
      Ведомство объявило свою платформу ИИ-проверки документации, и появилась идея продавать самопроверку до подачи.
      Запуск проверки смет не подтверждён, дата публикации неизвестна.
    lesson: Спрос, зависящий от чужого решения, идёт в обоснование как гипотеза с условием, а не как факт.

  # --- Шаг 2 · Решение и ценность ---
  - title: ИИ для того, что учётная система уже умеет
    step: 2
    text: >-
      Автоматическую генерацию сертификатов качества сочли свободной нишей, а это штатная функция ERP и лабораторных
      систем без всякого ИИ. Свободной оказалась только сверка входящих сертификатов.
    lesson: Прежде чем ставить модель, проверьте, не делает ли это уже учётная система правилом.
  - title: «Не нашли» — значит «нет»
    step: 2
    text: >-
      По первому сбору у российской BI-платформы не было ИИ-аналитика, и на этом строилась ниша. Повторный поиск
      нашёл модуль, который строит кубы и дашборды по запросу.
    lesson: Отсутствие функции у конкурента проверяют запросом к поставщику; прочерк в таблице ничего не доказывает.
  - title: Подпись и оплата остались у человека
    step: 2
    text: >-
      Агенты закупок ведут переписку и даже переговоры сами, но у всех заметных продуктов решение о контракте
      принимает команда покупателя, а оплата идёт только с явного подтверждения.
    lesson: Автономию дают на переписку и черновики, а необратимое и денежное — за человеком с первого дня.
  - title: Эффект поставщика без его условий
    step: 2
    text: >-
      Поставщик CLM-системы обещает вернуть 6–12 % стоимости договора сверкой счетов с условиями, но только при работе
      через одну конкретную закупочную платформу.
    lesson: Чужой эффект переносят только вместе с условиями — той же учётной системой и тем же процессом.
  - title: Оплата за результат без определения результата
    step: 2
    text: >-
      Агентская платформа для промышленности берёт около половины оплаты по результату, а её инженеры работают
      у заказчика. Спор начинается в день, когда стороны по-разному считают результат.
    lesson: Если оплата привязана к результату, результат, «до» и способ замера записывают до договора.
  - title: Проверка формы вместо проверки существа
    step: 2
    text: >-
      Государственные сервисы нормоконтроля проверяют оформление документации, а проверку по содержательным нормам
      делают только внутри экспертизы. Заказчик почти всегда ждёт второго.
    lesson: В границе решения прямо пишут, что проверяется — форма или существо; иначе KPI спорят на сдаче.
  - title: Своя база норм не по силам
    step: 2
    text: >-
      Небольшая команда начала собирать собственную базу норм и законов, хотя тексты с актуальностью редакций уже
      есть у правовых систем и справочных баз.
    lesson: Лицензируемый источник берут по API, а свою ценность строят слоем над ним — влияние, задачи, контроль.

  # --- Шаг 3 · Устройство и контроль ---
  - title: Свободный запрос вместо проверенного
    step: 3
    text: >-
      У зрелых ИИ-аналитиков ответ строится на семантическом слое и проверенных запросах: запрос собирается из модели
      данных, а не пишется сырым SQL. Свободная генерация даёт правдоподобные и неверные цифры.
    lesson: Модель выбирает из проверенного и собирает по слою, а не сочиняет запрос к базе.
  - title: Агент видит больше, чем спросивший
    step: 3
    text: >-
      Если агент ходит в базу под сервисной учётной записью, ответ рядовому сотруднику может содержать данные чужого
      отдела. У зрелых ИИ-аналитиков сгенерированный запрос выполняется с правами того, кто спросил.
    lesson: Агент работает от имени пользователя, а не от учётки со всеми правами.
  - title: Неразобранное превратилось в число
    step: 3
    text: >-
      Сервис сметы ставит отрицательное значение, если количество определить не удалось, и оно попадает в итог.
      Соседний сервис выводит строки без расценки отдельным списком и в сумму их не включает.
    lesson: Неразобранное — явная пометка и отдельный список, никогда не число, которое уйдёт в сумму.
  - title: Эскалация на каждое отклонение
    step: 3
    text: >-
      Если контроль подтверждений заказа поднимает карточку на каждое расхождение, покупатель перестаёт их читать.
      Зрелый продукт закупок эскалирует покупателю только отклонение выше порога.
    lesson: Порог эскалации задают числом, иначе человек тонет в карточках и нажимает не глядя.
  - title: Кандидат записали как решение
    step: 3
    text: >-
      В нормализации справочника каждую рекомендацию по аналогам человек принимает или отклоняет, и только принятое
      записывается обратно в учётную систему. Без этого дубли и неверные аналоги расходятся по всем документам.
    lesson: Кандидат живёт в карточке, в учётную систему попадает только решение человека.
  - title: Регламенты только в сканах
    step: 3
    text: >-
      В типичном холдинге часть регламентов существует только скан-копиями, а подтверждённую работу со сканами
      в документообороте заявляет единственный продукт. Ассистент молча не видит часть базы.
    lesson: Плохой вход ловят до индекса — скан без текстового слоя — распознавание и пометка, а не тихий пропуск.
  - title: Вывод без ссылки на фрагмент
    step: 3
    text: >-
      Проверка документов подрядчика по требованиям ТЗ даёт для каждого вывода ссылку на фрагмент документа. Без такой
      ссылки человек либо перепроверяет всё, либо принимает вывод на веру.
    lesson: Вывод без ссылки на фрагмент не показывают человеку — его нечем проверить.
  - title: Модель нашла, эксперт подтвердил
    step: 3
    text: >-
      Мировые сервисы мониторинга регуляторики держат собственных экспертов в контуре: модель находит изменение,
      эксперт подтверждает, к кому и к чему оно применимо.
    lesson: Применимость к конкретному процессу — решение эксперта, модель готовит кандидата с обоснованием.

  # --- Шаг 4 · Прототип и периметр ---
  - title: Модели отдали всю карточку клиента
    step: 4
    text: >-
      Для классификации заявки модели нужен только её текст, а карточка клиента и остатки уходят «заодно».
      Интегратор, который делает это аккуратно, передаёт модели только текст заявки.
    lesson: Модели передают минимум, нужный шагу; всё лишнее — лишний вопрос ИБ.
  - title: Язык и контур проверили по сайту
    step: 4
    text: >-
      Мировой ИИ-ассистент по данным выбрали по описанию, а в документации сказано: суверенные облака не поддерживаются,
      многоязычность официально не поддерживается. Для русскоязычного заказчика в закрытом контуре он выпал на прототипе.
    lesson: Русский язык и место работы модели проверяют в документации до прототипа, а не после.
  - title: Условия провайдера по обзорам
    step: 4
    text: >-
      Два сторонних обзора дали для одного юридического ИИ-ассистента разные условия: в одном 5 бесплатных запросов,
      в другом 20. Официального подтверждения хранения данных в РФ не нашлось ни там, ни там.
    lesson: Условия провайдера сверяют по договору для своего типа доступа, а не по обзорам.
  - title: Компоненту сняли защиту платформы
    step: 4
    text: >-
      Расширению для учётной системы для работы нужно снять «безопасный режим», и оно работает по ключу продавца.
      Пользователь видит одну кнопку, а компонент получает все права пользователя и доступ наружу.
    lesson: Компонент, которому нужно снять защиту платформы, проходит ИБ до установки, а не после.
  - title: Бюджет ушёл на железо
    step: 4
    text: >-
      В одной госзакупке 45 млн ₽ ушли на вычислительную платформу с ускорителями под ИИ для документооборота,
      а не на сам ИИ-модуль.
    lesson: Своё железо не делает систему — в смете должны быть модуль, набор проверок и инженер, который их держит.
  - title: Данные приходят позже решения
    step: 4
    text: >-
      Сервис контроля хода работ отдаёт отчёт по этажам и зонам через 6 часов после съёмки. Для решения, которое
      принимают сразу после обхода, это уже вчерашние данные.
    lesson: Задержку данных записывают в лист потолков рядом с лимитами, а не узнают на пилоте.
  - title: Входящее соединение в учётную систему
    step: 4
    text: >-
      Зрелый продукт ввода заказов связывается с ERP только исходящим соединением по HTTPS из контура клиента и
      ставится пакетом программ на стороне учётной системы. Это снимает половину вопросов ИБ ещё до встречи.
    lesson: Схему соединений рисуют на прототипе, а входящий доступ извне в учётную систему — отдельное решение ИБ.

  # --- Шаг 5 · Проверка и атаки ---
  - title: «Быстрее в N раз» без методики
    step: 5
    text: >-
      У российских СЭД с ИИ почти все числа — «ускорение в N раз» без методики. Долю документов, распознанных
      автоматически, публикует только один пилот — 69,2 %; числовой отчётности о точности на данных клиента нет ни у кого.
    lesson: Просить у поставщика долю на наборе заказчика; приёмка — эталонный набор, прогон и отчёт до закупки.
  - title: Публичный рейтинг не про вашу схему
    step: 5
    text: >-
      Модель «вопрос → SQL» по данным разработчика даёт 81,33 % на публичном наборе (у человека 92,96 %). На схеме
      около 101 таблицы и 869 колонок агент без подсказок дал 11,4 %, с подсказанной декомпозицией — около 30,1 %.
    lesson: Точность на публичном наборе не переносится на схему заказчика; мерить на его вопросах.
  - title: Набор исполнителя проверяет исполнителя
    step: 5
    text: >-
      Проверочный агент по документам подрядчиков заявил полноту 95 % и точность 93 %, но замер сделан на собственном
      размеченном наборе исполнителя.
    lesson: Приёмка идёт на наборе заказчика с его разметкой; набор исполнителя — только ориентир.
  - title: Одно число на всё
    step: 5
    text: >-
      ИИ-проверку чертежей заявили с F1 = 0,85 (точность 0,87, полнота 0,83). Какие нарушения пропущены и сколько
      среди них критичных, из одного числа не видно.
    lesson: Для проверки по нормам считают полноту по критичным нарушениям отдельно от общего числа.
  - title: Анекдот вместо замера
    step: 5
    text: >-
      Юрисконсульт клиента рассказал, что разбор договора занял 2 часа вместо полутора дней. Это один договор
      и пересказ поставщика, а не замер.
    lesson: Один случай — история для слайда; результат — набор с ожиданием, записанным до прогона.

  # --- Шаг 6 · Запуск и сдача ---
  - title: Продукт ушёл из-под проекта
    step: 6
    text: >-
      Стартап ввода заказов за год превратился в студию заказной разработки, и продуктовых страниц не осталось.
      Другая платформа перестала подключать новым клиентам свой конструктор агентов после покупки чужого продукта.
    lesson: В реестре рисков — уход поставщика или продукта, у риска владелец и план замены с набором проверок.
  - title: Автономию дали по совпадению с человеком
    step: 6
    text: >-
      До самостоятельной работы агент разбора заявок у поставщика закупочных агентов совпадал с проверяющими людьми
      в 99 % случаев (по данным поставщика), и только после этого его выпустили без проверки.
    lesson: Переход на следующую стадию — по совпадению с человеком на истории, а не по впечатлению.
  - title: Пилот вытянуло сопровождение
    step: 6
    text: >-
      В пилоте цифрового стройконтроля на двух секциях жилого комплекса дело решили сопровождение и доработка под
      заказчика, а не функции продукта.
    lesson: В плане запуска — люди сопровождения и время на доработку, иначе пилот не переходит в эксплуатацию.
  - title: Результат должен прожить 10 лет
    step: 6
    text: >-
      Цифровая инструкция по новому регламенту ЕС 2023/1230 должна быть доступна не менее 10 лет или весь срок службы
      машины, с офлайн-копией и бумагой по запросу в течение месяца.
    lesson: Срок хранения и доступности результата — требование эксплуатации; его пишут в план сдачи, а не открывают после.
  - title: Жалоба ушла продавцу, а не в набор
    step: 6
    text: >-
      В расширении для учётной системы есть кнопка жалобы на качество распознавания, но жалоба уходит продавцу.
      Заказчик не знает, сколько было жалоб и что с ними стало.
    lesson: Сообщение пользователя об ошибке попадает в набор проверок заказчика, а не только в поддержку продавца.
  - title: Модель сменилась без прогона
    step: 6
    text: >-
      Облачный ИИ-аналитик сам выбирает модель по списку приоритетов: недоступна первая — отвечает следующая.
      Один и тот же вопрос сегодня и завтра обрабатывают разные модели.
    lesson: Если модель может смениться без вас, прогон набора — регулярная процедура с владельцем, а не разовая проверка.
  - title: Система запомнила ошибку
    step: 6
    text: >-
      Сервис распознавания запоминает выбор пользователя после одного-двух раз. Неверный выбор закрепляется так же
      надёжно, как верный, а журнала расхождений и отчёта о точности нет ни у одного продукта ввода заказов.
    lesson: Обучение на правках идёт только вместе с журналом правок, который кто-то регулярно читает.
