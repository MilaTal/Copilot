# Карточки паттернов агентных систем и шаблоны схем «как работает агент».
# У паттерна три ответа: кто решает, где предел, что после. Пустой ответ — сценарий на глаз, а не паттерн.
# В шаблонах схем подставляются значения из ответов проекта: {trigger} {core} {read} {write} {human} {limit} {queue} {gate}.
patterns:
  - id: single
    title: Один агент с инструментами
    who_decides: агент внутри прогона выбирает инструмент
    limit: потолки шагов, денег и времени прогона
    after: исход «остановлено по пределу» — в ручную очередь
    when: Одна задача, один вход, несколько инструментов, этапы не разделяются.
    not_when: Шаги идут подряд и проверяются правилом — это конвейер, агент там лишний.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> A{{Агент: {core}}}
        A -- читает --> R[({read})]
        A -- пишет --> W[({write})]
        A --> L{Предел: {limit}}
        L -- достигнут --> Q[/Ручная очередь: {queue}/]
        A --> G{Гейт: {gate}}
        G -- не прошёл --> H[Человек: {human}]
        G -- прошёл --> W
  - id: router
    title: Router — маршрутизатор
    who_decides: прогон в момент выполнения, по типу входа
    limit: доля входов, уходящих в ручную очередь
    after: у каждого маршрута свой адресат
    when: Входы разных типов, заранее неизвестно, какой придёт.
    not_when: Маршрут читается в сценарии до запуска — это if-ветка, а не router.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> C{Классификатор входа}
        C -- тип А --> A1{{Агент: {core}}}
        C -- тип Б --> A2[Workflow по правилу]
        C -- неясно --> Q[/Ручная очередь: {queue}/]
        A1 --> G{Гейт: {gate}}
        A2 --> W[({write})]
        G -- прошёл --> W
        G -- не прошёл --> H[Человек: {human}]
        A1 --> L{Предел: {limit}}
        L -- достигнут --> Q
  - id: sequential
    title: Конвейер с валидатором
    who_decides: валидатор кодом по результату шага
    limit: число кругов возврата
    after: после предела — очередь к человеку или отказ, не новый круг
    when: Шаги тянутся подряд и каждый стык проверяется правилом — поля, типы, формат.
    not_when: Распределение этапов зависит от результата предыдущего — это supervisor.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> S1[Подготовка входа]
        S1 --> V1{Валидатор кодом}
        V1 -- не прошёл --> X[Отказ с причиной]
        V1 -- прошёл --> A{{Агент: {core}}}
        A -- читает --> R[({read})]
        A --> V2{Гейт: {gate}}
        V2 -- не прошёл, круг в пределах --> A
        V2 -- предел {limit} --> Q[/Ручная очередь: {queue}/]
        V2 -- прошёл --> W[({write})]
        W --> H[Человек: {human}]
  - id: supervisor
    title: Supervisor + субагенты
    who_decides: координатор — кому отдать этап и пускать ли на второй круг
    limit: круги на субагента и потолок каждого
    after: контракт стыка — что приходит, что уходит, что значит «не прошёл»
    when: Этапы нельзя пустить подряд — их распределение зависит от предыдущего результата.
    not_when: Этапы идут подряд и стыки проверяет код — координатор лишний.
    mermaid: |-
      flowchart TB
        T([{trigger}]) --> SV{{Координатор}}
        SV --> SA[Субагент-сборщик: {core}]
        SV --> SB[Субагент-проверяющий]
        SA -- результат --> SB
        SB -- не прошёл --> SV
        SV --> L{Предел: {limit}}
        L -- достигнут --> Q[/Ручная очередь: {queue}/]
        SB -- прошёл --> G{Гейт: {gate}}
        G --> W[({write})]
        G -- спорно --> H[Человек: {human}]
        SA -- читает --> R[({read})]
  - id: rag
    title: Agentic RAG
    who_decides: агент внутри прогона — хватит ли найденного
    limit: число обращений к поиску и потолок токенов на цикл
    after: ответ с найденным, включая честное «в документах этого нет», или отход к человеку
    when: Ответ собирается из базы знаний, число заходов заранее неизвестно.
    not_when: Достаточно одного поиска — это обычный RAG.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> A{{Агент: {core}}}
        A -- поиск --> K[(База знаний: {read})]
        K --> A
        A --> D{Хватает?}
        D -- нет, обращений в пределах --> A
        D -- предел {limit} --> N[Ответ «в документах этого нет»]
        D -- да --> G{Гейт: {gate}}
        G --> W[({write})]
        N --> H[Человек: {human}]
  - id: parallel
    title: Parallel — веер
    who_decides: проектировщик задаёт ветви заранее
    limit: число ветвей и потолок каждой
    after: сведение ответов в один
    when: Независимые части работы можно сделать одновременно, важна скорость.
    not_when: Ветви зависят друг от друга — это конвейер или supervisor.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> F{Веер}
        F --> B1{{Ветвь 1: {core}}}
        F --> B2{{Ветвь 2}}
        F --> B3{{Ветвь 3}}
        B1 --> M[Сведение]
        B2 --> M
        B3 --> M
        M --> G{Гейт: {gate}}
        G --> W[({write})]
        G -- не прошёл --> H[Человек: {human}]
        M --> L{Предел: {limit}}
        L -- достигнут --> Q[/Ручная очередь: {queue}/]
  - id: evaluator
    title: Генератор и оценщик
    who_decides: модель-оценщик по заранее записанному критерию — пройден он или нужен ещё круг
    limit: число кругов «написать — оценить — поправить»
    after: после предела — лучший вариант человеку с пометкой «критерий не пройден», не новый круг
    when: Есть ясный критерий качества, который проверяет только модель, и замечания оценщика реально улучшают черновик — перевод, текст по требованиям, сложная сводка.
    not_when: Критерий проверяется кодом — это конвейер с валидатором. Критерия нет — оценщик спорит по вкусу и гоняет круги впустую. Оценщик той же модели повторяет ошибки генератора.
    mermaid: |-
      flowchart LR
        T([{trigger}]) --> A{{Генератор: {core}}}
        A -- читает --> R[({read})]
        A --> E{Оценщик по критерию: {gate}}
        E -- замечания, круг в пределах --> A
        E -- предел {limit} --> Q[/Ручная очередь: {queue}/]
        E -- прошёл --> W[({write})]
        W --> H[Человек: {human}]

# Соответствие варианта ответа на вопрос «паттерн» шага Ш3 и карточки
choice_map:
  Один агент с инструментами: single
  Router — маршрутизатор: router
  Конвейер с валидатором: sequential
  Supervisor + субагенты: supervisor
  Agentic RAG: rag
  Parallel — веер: parallel
  Генератор и оценщик: evaluator
