# Демонстрационный сценарий полного цикла на маршруте из 6 шагов (Ш1–Ш6), schema: 3.
# Компания, люди и все числа вымышлены: бухгалтерия условной торговой компании сверяет счета поставщиков с заказами.
# Сценарий нужен для прогона без модели (python -m scenarios.run_scenario demo_scenario --dry-run) и для проверок в tests/:
# ответ есть на каждый из 68 вопросов ядра. Это проверочные данные, а не образец проекта для защиты.
#
# Поля ответа: step, qid — шаг и вопрос ядра; value — ответ (text — строка, choice — один вариант ядра, multi — список
# вариантов ядра, table — список строк с ячейками по колонкам ядра); extra — строка extra_text; note — комментарий.
# Разметка: expect — accepted (ответ закрывает вопрос) или needs_detail (ответ намеренно слабый); у слабого ответа
# flaw — что заложено и каким сигналом это ловится (senior | risk | consistency), rework — ответ после доработки.
# В каждом шаге два слабых ответа. На Ш1 и в отрезке «Граница» Ш2 чисел нет: так требует ядро.
schema: 3
project:
  name: "Вымышленный пример: сверка счетов с заказами"
  domain: procurement
  description: "Вымышленная компания. Система сверяет счёт поставщика с заказом и отмечает расхождения, бухгалтер решает об оплате."
answers:
# ---------------- Ш1 «Проблема» (без чисел) ----------------
- {step: 1, qid: process, expect: accepted, value: "На общий ящик приходит счёт поставщика. Система находит заказ, сверяет позиции и цены и показывает бухгалтеру расхождения с цитатой из счёта. Бухгалтер решает, оплачивать ли счёт."}
- {step: 1, qid: why_company, expect: accepted, value: "Бухгалтеры вручную ищут заказ по каждому счёту и сверяют позиции. Работа долгая, в конце месяца счета копятся, а переплаты находятся уже после оплаты."}
- {step: 1, qid: who_needs, expect: accepted, value: "Пользуются бухгалтеры расчётной группы. Выигрывает финансовый директор: меньше переплат. Работы прибавится закупщику, он разбирает расхождения. Решение затрагивает поставщиков: задержку оплаты они оспаривают у бухгалтера."}
- {step: 1, qid: if_nothing, expect: accepted, value: "Очередь счетов будет расти вместе с закупками, придётся нанимать ещё одного бухгалтера, а переплаты так и будут находиться задним числом."}
- {step: 1, qid: success_picture, expect: accepted, value: "Бухгалтер открывает счёт и сразу видит заказ и расхождения, а не ищет их сам. В конце месяца нет завала."}
- {step: 1, qid: decision_maker, expect: accepted, value: "Финансовый директор"}
- step: 1
  qid: as_is_table
  expect: accepted
  value:
  - ["Счёт пришёл вложением на общий ящик, с него начинает работу бухгалтер", "бухгалтер", "почта", "вложения теряются в переписке"]
  - ["Найти заказ по номеру из счёта", "бухгалтер", "учётная система", "номер заказа часто указан в свободном тексте"]
  - ["Сверить позиции и цены", "бухгалтер", "учётная система и таблица", "позиции названы у поставщика иначе"]
  - ["Согласовать расхождение", "закупщик", "почта", "ответ приходит с задержкой"]
  - ["Поставить счёт в оплату", "бухгалтер", "учётная система", "ручной перенос реквизитов"]
- {step: 1, qid: bottleneck, expect: needs_detail, value: "Сверка.", flaw: {what: "не названы шаг и причина", signal: senior}, rework: "Больнее всего на сверке позиций: поставщик называет товар по-своему, справочника соответствий нет, поэтому бухгалтер сопоставляет строки по памяти и сверяется с закупщиком."}
- {step: 1, qid: incidents, expect: accepted, value: "В прошлом квартале оплатили счёт сверх заказа и вернули деньги только после звонка поставщику. Ещё один счёт потерялся в почте и был оплачен с просрочкой."}
- {step: 1, qid: reality_gap, expect: accepted, value: "По регламенту сверяется каждая позиция. На деле в конце месяца мелкие счета сверяют только по итоговой сумме."}
- {step: 1, qid: data_where, expect: needs_detail, value: "В почте и в учётной системе.", flaw: {what: "нет следов работы и выгрузки для замера", signal: senior}, rework: "Счета лежат на общем почтовом ящике, заказы и оплаты в учётной системе, расхождения в таблице бухгалтера и в письмах закупщику. Следы работы видны в журнале учётной системы, выгрузку делает администратор."}
# ---------------- Ш2 «Решение и ценность» ----------------
- {step: 2, qid: core_step, expect: accepted, value: "Сверка позиций счёта с заказом: именно здесь уходит время и именно здесь нужен разбор свободного текста."}
- step: 2
  qid: boundary_table
  expect: accepted
  value:
  - ["Счёт пришёл на ящик", "перепроектировать", "правило", "вложения забираются автоматически"]
  - ["Найти заказ", "схлопнуть со сверкой", "агент", "поиск и сверка идут одним действием"]
  - ["Сверить позиции и цены", "перепроектировать", "агент", "ядро системы"]
  - ["Согласовать расхождение", "оставить", "человек", "замену позиции знает только закупщик"]
  - ["Поставить счёт в оплату", "оставить", "человек", "оплата необратима"]
- step: 2
  qid: to_be_table
  expect: accepted
  value:
  - ["Забрать счёт с ящика", "workflow", "нет", "при плохом файле назад бухгалтеру"]
  - ["Сверка позиций счёта с заказом", "агент", "карточка счёта", "при сомнении бухгалтеру"]
  - ["Разобрать расхождение", "человек", "карточка счёта", "закупщику с вопросом"]
  - ["Поставить счёт в оплату", "человек", "экран оплаты", "нет, действие последнее"]
- {step: 2, qid: human_left, expect: needs_detail, value: "Человек проверяет.", flaw: {what: "нет свойства работы, которое требует человека", signal: senior}, rework: "Решение об оплате счёта с расхождением остаётся у бухгалтера: оплата необратима, деньги уходят поставщику, а расхождение бывает согласованной заменой позиции, о которой знает только закупщик."}
- {step: 2, qid: write_action, expect: accepted, value: "Агент записывает пометку о расхождении в карточку счёта. Оплату он не ставит: это делает бухгалтер."}
- {step: 2, qid: access, expect: accepted, value: "Да — доступ есть и проверен"}
- {step: 2, qid: agency_level, expect: accepted, value: "Агент с фиксированным набором инструментов"}
- {step: 2, qid: secret_kind, expect: accepted, value: "Тайна в процессе — всё локально", extra: "Цены поставщиков — коммерческая тайна, поэтому модель работает в контуре компании. Срок — пилот до конца квартала, бюджет — существующий сервер."}
- {step: 2, qid: loss_now, expect: accepted, value: "Бухгалтер тратит 40 минут на счёт, 120 счетов в неделю — около 80 часов в неделю двух бухгалтеров (оценка по журналу)."}
- step: 2
  qid: kpi_table
  expect: accepted
  value:
  - ["Доля счетов, оплаченных без ручной сверки (главное число ЛПР)", "0 %", "60 %", "журнал учётной системы, еженедельно"]
  - ["Время на счёт", "40 минут", "15 минут", "выборка 30 счетов в месяц"]
  - ["Переплаты за квартал", "3 случая", "0 случаев", "реестр казначейства"]
- {step: 2, qid: success_criterion, expect: needs_detail, value: "Система отработала.", flaw: {what: "нет проверяемого признака успеха", signal: senior}, rework: "Успех — расхождение отмечено верно и за 5 рабочих дней бухгалтер его не отменил, либо обоснованный отказ «заказ не найден». Проверяю по журналу отмен пометок раз в неделю, отвечает старший бухгалтер."}
- {step: 2, qid: tradeoff, expect: accepted, value: "Сверка ускорится, но первое время бухгалтер будет дольше проверять отметки и может перестать им верить после ложных срабатываний."}
# ---------------- Ш3 «Устройство и контроль» ----------------
- {step: 3, qid: trigger, expect: accepted, value: "Событие: новое письмо с вложением на общем ящике. Правило записано в настройках почтового шлюза."}
- {step: 3, qid: pattern, expect: accepted, value: "Конвейер с валидатором"}
- {step: 3, qid: pattern_answers, expect: accepted, value: "Решает порядок шагов код, модель только сопоставляет строки. Предел — 3 шага на счёт и 1 повтор. После предела счёт уходит бухгалтеру со статусом «остановлено по пределу»."}
- step: 3
  qid: tools_table
  expect: accepted
  value:
  - ["найти заказ", "чтение", "учётная система", "только чтение заказов", "безопасен", "нет доступа к оплатам"]
  - ["поставить пометку", "запись", "учётная система", "запись только в поле пометки", "с ключом идемпотентности", "нельзя менять суммы"]
- {step: 3, qid: rules_layer, expect: accepted, value: "Описание задачи в промпте. Критичные правила стоят в коде: запись только в поле пометки, сумма никогда не меняется."}
- step: 3
  qid: model_per_step
  expect: accepted
  value:
  - ["Сверка позиций", "локальная", "цены не уходят наружу"]
- step: 3
  qid: control_table
  expect: accepted
  value:
  - ["Забрать счёт", "обратимый", "нет", "старший бухгалтер", "ошибка видна в журнале"]
  - ["Поставить пометку", "обратимый", "посмотреть", "бухгалтер", "пометку можно снять"]
  - ["Поставить счёт в оплату", "необратимый", "утвердить", "бухгалтер", "деньги уходят поставщику"]
- {step: 3, qid: quality_gate, expect: needs_detail, value: "Проверяем результат.", flaw: {what: "нет машинного условия и действия при провале", signal: senior}, rework: "Код проверяет, что ответ модели проходит схему и у каждой отмеченной строки есть цитата из счёта. Не прошло — один повтор, затем счёт уходит бухгалтеру со статусом «не проверено», срок разбора один рабочий день."}
- {step: 3, qid: stop_point, expect: accepted, value: "Выполнение останавливается на экране оплаты: без «да» бухгалтера счёт в оплату не встаёт. Бухгалтер видит ровно те сумму и реквизиты, которые уйдут в банк."}
- {step: 3, qid: escalation, expect: needs_detail, value: "Передаём людям.", flaw: {what: "нет адресата и срока", signal: senior}, rework: "Адресат один — старший бухгалтер, срок один рабочий день. После срока письмо финансовому директору, счёт остаётся в ручной очереди. Очередь разбирает старший бухгалтер ежедневно в 10:00."}
- step: 3
  qid: failures_table
  expect: accepted
  value:
  - ["приём счёта", "плохой вход (ловим до модели): файл не читается", "текст не извлечён", "счёт уходит бухгалтеру", "бухгалтер, сразу", "условие: нет текста · предел 1 проверка · ручная очередь"]
  - ["запись пометки", "действие выполнено наполовину: пометка записана, журнал нет", "нет парной записи в журнале", "сверка журнала и досыл по ключу", "старший бухгалтер, в течение часа", "условие: нет пары · предел 3 повтора · ручная очередь"]
  - ["сверка", "модель недоступна", "ошибка соединения", "счёт идёт по старому маршруту", "старший бухгалтер, сразу", "условие: ошибка · предел 2 повтора · ручная очередь"]
- {step: 3, qid: idempotency, expect: accepted, value: "Ключ — номер счёта и идентификатор поставщика. Повторный запуск с тем же ключом пометку не дублирует."}
- {step: 3, qid: concurrency, expect: accepted, value: "На один счёт второй запуск ждёт замка на ключе в базе и завершается без записи. На разные счета запуски идут параллельно, не больше 4 одновременно."}
# ---------------- Ш4 «Прототип и периметр» ----------------
- {step: 4, qid: stack, expect: accepted, value: "Только Python"}
- step: 4
  qid: seed_cases
  expect: accepted
  value:
  - ["Счёт совпадает с заказом", "пометка «расхождений нет»", "пометка в карточке"]
  - ["Цена в счёте выше заказа", "пометка с цитатой строки", "цитата совпала со строкой счёта"]
  - ["Заказ не найден", "отказ «заказ не найден»", "статус отказа в журнале"]
- {step: 4, qid: prototype_run, expect: accepted, value: "Да — видно вторым окном"}
- {step: 4, qid: endpoint, expect: accepted, value: "POST http://127.0.0.1:8100/run — стенд прототипа, не рабочая система. Поле входа query — номер счёта; поле ответа answer — карточка расхождений, status — итог, cost_usd — цена прогона."}
- step: 4
  qid: limits_table
  expect: accepted
  value:
  - ["шаги", "3", "замер на прототипе", "счёт бухгалтеру", "старший бухгалтер", "в коде конвейера, проверено тестом"]
  - ["деньги", "0,05 $", "расчёт по токенам", "счёт бухгалтеру", "старший бухгалтер", "в обёртке вызова, проверено тестом"]
  - ["время", "120 секунд", "замер на прототипе", "счёт бухгалтеру", "старший бухгалтер", "тайм-аут вызова, проверено на стенде"]
- {step: 4, qid: limit_outcome, expect: needs_detail, value: "Видно по статусу.", flaw: {what: "нет ветки, статуса и признака в журнале", signal: senior}, rework: "Отдельная ветка: статус записи stopped_by_limit вместо done, в журнале признак предела и какой потолок сработал, счёт попадает в ручную очередь старшего бухгалтера. Отчёт считает такие счета отдельно от сделанных."}
- step: 4
  qid: hosting_table
  expect: accepted
  value:
  - ["Сверка позиций", "своё железо", "ничего", "счета, заказы, журнал", "0 $, сервер уже есть"]
  - ["Запись пометки", "своё железо", "ничего", "карточка счёта", "0 $, сервер уже есть"]
- {step: 4, qid: vendor_terms, expect: accepted, value: "Модель локальная, данные провайдеру не передаются. Сторонних коннекторов нет, версии библиотек закреплены в файле зависимостей."}
- {step: 4, qid: audit_log, expect: needs_detail, value: "Пишем в лог.", flaw: {what: "нет места, автора действия и срока хранения", signal: senior}, rework: "Журнал аудита в отдельной таблице базы: кто (агент или логин бухгалтера), когда, какой счёт и какое поле изменено, значение до и после. Хранение 3 года, агент может только дописывать, отвечает администратор учётной системы."}
- {step: 4, qid: key_rotation, expect: accepted, value: "Токен выпускает администратор учётной системы, хранится в менеджере секретов, меняется раз в квартал. При утечке токен отзывается в течение часа, запуски приостанавливаются."}
- {step: 4, qid: security_checklist, expect: accepted, value: "Токен с правом записи только в поле пометки, наружу ничего не уходит, всё на своём железе, пилот на одной расчётной группе, журналы хранятся внутри контура."}
# ---------------- Ш5 «Проверка и атаки» ----------------
- step: 5
  qid: eval_table
  expect: accepted
  value:
  - ["типовой", "счёт совпадает с заказом", "расхождений нет", "пометка верна", "код"]
  - ["типовой", "цена выше заказа", "отмечена строка", "цитата совпала", "код"]
  - ["типовой", "лишняя позиция в счёте", "отмечена строка", "цитата совпала", "код"]
  - ["типовой", "счёт на часть заказа", "отметка о частичной поставке", "статус верен", "код"]
  - ["пограничный", "позиция названа иначе", "предложено соответствие", "бухгалтер подтвердил", "человек"]
  - ["пограничный", "разница в цене на округление", "расхождений нет", "пометка верна", "код"]
  - ["невалидный", "пустой файл", "отказ до модели", "статус отказа", "код"]
  - ["невалидный", "файл не читается", "отказ до модели", "статус отказа", "код"]
  - ["отказ-эскалация", "заказ не найден", "ручная очередь", "статус очереди", "код"]
  - ["отказ-эскалация", "модель недоступна", "старый маршрут", "статус очереди", "код"]
- {step: 5, qid: judge_calibration, expect: accepted, value: "Судья-модель не используется: признаки проверяет код, спорные строки смотрит бухгалтер. Журналы прогонов читал старший бухгалтер."}
- step: 5
  qid: runs_table
  expect: accepted
  value:
  - ["1", "счёт совпадает", "да", "0,01"]
  - ["2", "цена выше заказа", "да", "0,02"]
  - ["3", "лишняя позиция", "да", "0,02"]
  - ["4", "позиция названа иначе", "нет", "0,03"]
  - ["5", "заказ не найден", "да", "0,01"]
- {step: 5, qid: break_even, expect: accepted, value: "Модель локальная, сервер уже есть, поэтому порога окупаемости относительно API в пилоте не считаем. Пересчитаем, когда понадобится второй сервер."}
- {step: 5, qid: regression, expect: needs_detail, value: "Стало лучше.", flaw: {what: "нет изменения и чисел до и после", signal: senior}, rework: "Меняли правило сопоставления названий позиций. Тот же набор из 10 проверок: до изменения прошло 7 из 10, после 9 из 10, новых провалов нет. Остался случай с позицией, названной иначе."}
- {step: 5, qid: untrusted_inputs, expect: accepted, value: "Счета и письма поставщиков: их текст пишет посторонний человек. Текст считается данными, а не инструкциями."}
- {step: 5, qid: attack_target, expect: accepted, value: "Стенд прототипа 127.0.0.1:8100 на отдельной машине: копия базы с вымышленными счетами и тестовые ключи. С рабочими системами стенд не связан."}
- step: 5
  qid: attack_selection
  expect: accepted
  value:
  - "Инъекция инструкций через входные данные"
  - "Лишние права и действия вне задачи"
