# Проверки срабатывания скиллов: запросы написаны как от пользователя, без названия скилла.
# should_trigger — скилл должен включиться; should_not_trigger — не должен.
ai-automation-copilot:
  should_trigger:
    - "Хочу сделать ИИ-агента, который разбирает входящие письма с запросами КП. С чего начать?"
    - "Помоги спроектировать автоматизацию проверки договоров на LLM — от идеи до прода"
    - "У нас есть идея агента для закупок, но непонятно, где граница: что отдать модели, а что оставить людям"
    - "Как оценить, готов ли наш ИИ-агент к запуску в прод?"
    - "Нужна схема n8n и каркас на Python для агента, который сверяет счета с заказами"
    - "Проверь нашего агента на промпт-инъекции и перерасход, у нас есть тестовый стенд"
    - "Design an AI agent for invoice matching from idea to production"
    - "Plan an agentic workflow for our support team and tell me what could break in prod"
  should_not_trigger:
    - "Напиши SQL-запрос для отчёта по продажам за квартал"
    - "Переведи этот текст на английский"
    - "Почини падающий тест в моём проекте на React"
    - "Какая погода завтра в Москве?"
    - "Сделай презентацию о нашей компании для новых сотрудников"
ai-project-review:
  should_trigger:
    - "Подготовь защиту ИИ-проекта перед финдиректором — 3 слайда"
    - "Проверь, что все числа в нашей презентации про агента сходятся с документами"
    - "Как ответить руководителю на вопрос, сколько будет стоить агент в эксплуатации?"
    - "Prepare an executive pitch for our LLM automation project"
  should_not_trigger:
    - "Сделай слайды с итогами квартала"
    - "Проверь орфографию в этом письме"
    - "Спроектируй ИИ-агента для разбора писем"
